  <script>
    // Suppress Babel 500KB styling deoptimisation notice in console
    (function() {
      const origError = console.error;
      const origWarn = console.warn;
      const filterNotice = function(...args) {
        if (args[0] && typeof args[0] === 'string' && (args[0].includes('exceeds the max of 500KB') || args[0].includes('deoptimised the styling'))) {
          return true;
        }
        return false;
      };
      console.error = function(...args) {
        if (filterNotice(...args)) return;
        origError.apply(console, args);
      };
      console.warn = function(...args) {
        if (filterNotice(...args)) return;
        origWarn.apply(console, args);
      };
    })();

    // Register React Classic runtime preset to ensure JSX compiles to React.createElement without ES module imports
    if (window.Babel && Babel.availablePresets && Babel.availablePresets.react) {
      try {
        Babel.registerPreset('react-classic', {
          presets: [
            [Babel.availablePresets.react, { runtime: 'classic' }]
          ]
        });
      } catch (err) {
        console.warn('Preset registration error:', err);
      }
    }
  </script>

    ];

      if (explicit === "URGENT" || sla.isOverdue || (!sla.isCompleted && sla.workingDaysRemaining <= 5)) {

    // Pipeline stages - Bilingual English (Thai)
    const STAGES = [
      { id: "received", label: "Request Received (รับคำขอสรรหา)", desc: "Pending Admin/Approver Verification (คำขอรอการตรวจสอบ)" },
      { id: "manpower", label: "1. Manpower Request (1. เปิดคำขอกำลังคน)", desc: "Ready for Recruitment (พร้อมดำเนินการสรรหา)" },
      { id: "interview", label: "2. Interview Stage (2. นัดหมายสัมภาษณ์)", desc: "Interviews & Assessments (นัดหมายและประเมินผู้สมัคร)" },
      { id: "offer", label: "3. Offer Sent (3. ยื่นข้อเสนอจ้างงาน)", desc: "Employment Offer (ยื่นข้อเสนอรับเข้าทำงาน)" },
      { id: "onboarded", label: "4. Onboarded / Filled (4. บรรจุงานเรียบร้อย)", desc: "Starting Date & Onboarding (เริ่มงานและบรรจุตำแหน่ง)" },
      { id: "cancelled", label: "Cancelled / Rejected (ยกเลิก/สละสิทธิ์)", desc: "Request Cancelled (ยกเลิกคำขอ / ผู้สมัครสละสิทธิ์)" }

    const EVALUATION_CRITERIA = [

    const EVALUATOR_ROLES = [
      "Hiring Manager (ผู้บังคับบัญชาสายงาน)",

      "Department Director (ผู้อำนวยการฝ่ายงาน)"
    ];

    function calculateWorkingDays(startDateStr, endDateStr = null) {
      if (!startDateStr) return 0;
      const start = new Date(startDateStr);
      const end = endDateStr ? new Date(endDateStr) : new Date();
      if (isNaN(start.getTime()) || isNaN(end.getTime())) return 0;

      start.setHours(0, 0, 0, 0);
      end.setHours(0, 0, 0, 0);
      if (start > end) return 0;

      let count = 0;
      let cur = new Date(start);
      while (cur < end) {
        cur.setDate(cur.getDate() + 1);
        const day = cur.getDay();
        if (day !== 0 && day !== 6) {
          count++;
        }
      }
      return count;
    }

    const STANDARD_SLA_WORKING_DAYS = 30;

    const getSLAInfo = (requestDate, stage, offerSentDate = null) => {
      const workingDaysElapsed = calculateWorkingDays(requestDate, null);
      const workingDaysRemaining = STANDARD_SLA_WORKING_DAYS - workingDaysElapsed;
      const isCompleted = stage === "onboarded" || stage === "cancelled";
      const isOverdue = !isCompleted && workingDaysElapsed > STANDARD_SLA_WORKING_DAYS;

      let offerLeadTimeWorkingDays = null;
      if (offerSentDate) {
        offerLeadTimeWorkingDays = calculateWorkingDays(requestDate, offerSentDate);
      } else if (stage === "offer") {
        offerLeadTimeWorkingDays = workingDaysElapsed;
      }

      return { workingDaysElapsed, workingDaysRemaining, isOverdue, isCompleted, offerLeadTimeWorkingDays };
    };

    const getRecruitmentDurationInfo = (requestDate, hireDate, lastUpdated) => {
      if (!requestDate) return { rangeText: "-", totalDays: 0, workingDays: 0, closeDateStr: "-" };
      const closeDateStr = (hireDate && hireDate.trim())
        ? hireDate
        : (lastUpdated ? lastUpdated.split(' ')[0] : new Date().toISOString().split('T')[0]);

      const start = new Date(requestDate);
      const end = new Date(closeDateStr);
      let totalDays = 0;
      if (!isNaN(start.getTime()) && !isNaN(end.getTime())) {
        const diffTime = Math.max(0, end.getTime() - start.getTime());
        totalDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
      }
      const workingDays = calculateWorkingDays(requestDate, closeDateStr);
      const rangeText = `${requestDate} ถึง ${closeDateStr}`;
      return { rangeText, totalDays, workingDays, closeDateStr };
    };

    // คำนวณสถานะกำหนดการสัมภาษณ์เทียบกับวันปัจจุบัน (วันนี้, พรุ่งนี้, อีก 2-3 วันข้างหน้า)
    const getInterviewRelativeTimeInfo = (scheduleStr) => {
      if (!scheduleStr) return null;
      const match = String(scheduleStr).match(/(\d{4})-(\d{2})-(\d{2})/);
      if (!match) return null;
      const [_, y, m, d] = match;
      const interviewDate = new Date(parseInt(y, 10), parseInt(m, 10) - 1, parseInt(d, 10));
      interviewDate.setHours(0, 0, 0, 0);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const diffTime = interviewDate.getTime() - today.getTime();
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays < 0) {
        const absDays = Math.abs(diffDays);
        return {
          text: absDays === 1 ? "ผ่านมาเมื่อวาน" : `ผ่านมา ${absDays} วันแล้ว`,

          dotBg: "bg-slate-400",
          ping: false
        };
      } else if (diffDays === 0) {
        return {
          text: "⚡ วันนี้ (Today)",
          badge: "bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-200 border-rose-300 dark:border-rose-700 font-extrabold ring-1 ring-rose-500/30",
          dotBg: "bg-rose-500",
          ping: true
        };
      } else if (diffDays === 1) {
        return {
          text: "🔔 พรุ่งนี้ (Tomorrow)",
          badge: "bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-200 border-amber-300 dark:border-amber-700 font-bold",
          dotBg: "bg-amber-500",
          ping: true
        };
      } else if (diffDays === 2) {
        return {
          text: "🗓️ อีก 2 วันข้างหน้า",
          badge: "bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-200 border-sky-300 dark:border-sky-700 font-bold",
          dotBg: "bg-sky-500",
          ping: false
        };
      } else if (diffDays === 3) {
        return {
          text: "🗓️ อีก 3 วันข้างหน้า",
          badge: "bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-200 border-sky-300 dark:border-sky-700 font-bold",
          dotBg: "bg-sky-500",
          ping: false
        };
      } else if (diffDays <= 7) {
        return {
          text: `🗓️ อีก ${diffDays} วันข้างหน้า`,
          badge: "bg-blue-50 text-blue-700 dark:bg-blue-950/80 dark:text-blue-300 border-blue-200 dark:border-blue-800 font-semibold",
          dotBg: "bg-blue-500",
          ping: false
        };
      } else {
        return {

    // Helper function to extract and normalize Google Meet URLs
    const extractGoogleMeetUrl = (item) => {
      if (!item) return "";
      if (item.googleMeetUrl && typeof item.googleMeetUrl === 'string' && item.googleMeetUrl.trim()) {
        let url = item.googleMeetUrl.trim();
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
          url = 'https://' + url;
        }
        return url;
      }
      const scheduleStr = item.interviewSchedule || (typeof item === 'string' ? item : "");
      if (typeof scheduleStr === 'string') {
        const match = scheduleStr.match(/(https?:\/\/meet\.google\.com\/[a-zA-Z0-9_\-]+|meet\.google\.com\/[a-zA-Z0-9_\-]+)/);
        if (match) {
          let url = match[0];
          if (!url.startsWith('http://') && !url.startsWith('https://')) {
            url = 'https://' + url;
          }
          return url;
        }
      }
      return "";
    };

    const calculateOverallScore = (evaluations = []) => {
      if (!evaluations || evaluations.length === 0) {
        return { count: 0, combinedAvg: 0, combinedPct: 0, result: "" };
      }
      const sumAvg = evaluations.reduce((acc, ev) => acc + (Number(ev.avg) || 0), 0);
      const combinedAvg = parseFloat((sumAvg / evaluations.length).toFixed(1));
      const combinedPct = Math.round((combinedAvg / 5) * 100);
      const isPass = combinedPct >= 70;
      return {
        count: evaluations.length,
        combinedAvg,
        combinedPct,
        result: isPass ? "Pass" : "Fail"
      };
    };

    function parseCSVText(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let current = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(current.trim());
          current = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && next === '\n') i++;
          row.push(current.trim());
          if (row.some(c => c !== '')) lines.push(row);
          row = [];
          current = '';
        } else {
          current += char;
        }
      }
      if (current || row.length > 0) {
        row.push(current.trim());
        if (row.some(c => c !== '')) lines.push(row);
      }
      return lines;
    }

              const nameVal = (nameIdx !== -1 && r[nameIdx]) ? r[nameIdx].trim() : (r[0] || '').trim();
              if (!nameVal || nameVal.includes("ชื่อ")) continue;

              const nameEnVal = (nameEnIdx !== -1 && r[nameEnIdx]) ? r[nameEnIdx].trim() : "";
              const deptVal = (deptIdx !== -1 && r[deptIdx]) ? r[deptIdx].trim() : "-";
              const divVal = (divIdx !== -1 && r[divIdx]) ? r[divIdx].trim() : "-";

              loaded.push({
                name: nameVal,
                nameEn: nameEnVal || nameVal,
                email: (emailIdx !== -1 ? r[emailIdx] : r.find(c => c && c.includes("@")))?.trim() || "",
                position: (posIdx !== -1 ? r[posIdx] : r[1])?.trim() || "Staff",
                department: deptVal,
                division: divVal
              });
            }

            if (loaded.length > 0) {
              setPersonnelList(loaded);
              localStorage.setItem("hr_personnel_v62", JSON.stringify(loaded));
              if (showToast) triggerToast(`ซิงค์รายชื่อบุคลากรสำเร็จ (${loaded.length} คน)`);
            }
          }
        } catch (err) {
          if (showToast) triggerToast("ใช้ออฟไลน์ข้อมูลแคชเดิม");
        }
      };

      const syncCandidatesFromGoogleSheet = async (showToast = false) => {
        try {
          const res = await fetch(GOOGLE_SHEET_CANDIDATES_CSV_URL);
          if (!res.ok) throw new Error("Network error");
          const csvText = await res.text();
          const rows = parseCSVText(csvText);

          if (rows.length > 1) {
            const header = rows[0].map(h => (h || '').toLowerCase().trim());
            let noIdx = header.findIndex(h => h.includes('no') || h.includes('ลำดับ'));
            let yearIdx = header.findIndex(h => h.includes('year') || h.includes('ปี'));
            let monthIdx = header.findIndex(h => h.includes('month') || h.includes('เดือน'));
            let nameIdx = header.findIndex(h => (h.includes('ชื่อ') || h.includes('name')) && !h.includes('เล่น'));
            let nickIdx = header.findIndex(h => h.includes('เล่น') || h.includes('nick'));
            let phoneIdx = header.findIndex(h => h.includes('เบอร์') || h.includes('phone') || h.includes('tel'));
            let posIdx = header.findIndex(h => h.includes('ตำแหน่ง') || h.includes('position'));
            let levelIdx = header.findIndex(h => h.includes('level') || h.includes('ระดับ'));
            let branchIdx = header.findIndex(h => h.includes('branch') || h.includes('สาขา'));
            let typeIdx = header.findIndex(h => h.includes('type') || h.includes('ประเภท'));
            let mbtiIdx = header.findIndex(h => h.includes('mbti'));
            let prescreenIdx = header.findIndex(h => h.includes('prescreen'));
            let resumeConfirmIdx = header.findIndex(h => h.includes('confirm'));
            let interviewDateIdx = header.findIndex(h => h.includes('interview') || h.includes('สัมภาษณ์'));
            let hireDateIdx = header.findIndex(h => h.includes('hire') || h.includes('เริ่มงาน'));
            let statusIdx = header.findIndex(h => h.includes('status') || h.includes('สถานะ'));
            let channelIdx = header.findIndex(h => h.includes('channel') || h.includes('source') || h.includes('ช่องทาง'));
            let remarkIdx = header.findIndex(h => h.includes('remark') || h.includes('หมายเหตุ'));
            let driveIdx = header.findIndex(h => h.includes('drive') || h.includes('resume') || h.includes('cv') || h.includes('เอกสาร') || h.includes('link') || h.includes('url'));
            if (driveIdx === -1 && header.length >= 19) driveIdx = 18;

            const loaded = [];
            for (let i = 1; i < rows.length; i++) {
              const r = rows[i];
              if (!r || r.length < 2) continue;

              const fullName = (nameIdx !== -1 && r[nameIdx]) ? r[nameIdx].trim() : (r[3] || '').trim();
              if (!fullName || fullName.includes("ชื่อ")) continue;

              const rawStatus = (statusIdx !== -1 && r[statusIdx]) ? r[statusIdx].trim() : "Pending";
              const matchedStatus = CANDIDATE_STATUS_CONFIG.find(c => 
                c.id.toLowerCase() === rawStatus.toLowerCase() || 
                c.label.toLowerCase() === rawStatus.toLowerCase() ||
                rawStatus.toLowerCase().includes(c.id.toLowerCase())
              )?.id || "Pending";
              const existingCand = candidatePool.find(c => c.fullName === fullName);
              const sheetDriveUrl = (driveIdx !== -1 && r[driveIdx]) ? r[driveIdx].trim() : (r[18] ? r[18].trim() : "");

              loaded.push({
                no: (noIdx !== -1 && r[noIdx]) ? r[noIdx].trim() : i,
                year: (yearIdx !== -1 && r[yearIdx]) ? r[yearIdx].trim() : "2026",
                month: (monthIdx !== -1 && r[monthIdx]) ? r[monthIdx].trim() : "08",
                candidateId: `CAND-2026-${String(i).padStart(3, '0')}`,
                fullName,
                nickname: (nickIdx !== -1 && r[nickIdx]) ? r[nickIdx].trim() : "",
                phone: (phoneIdx !== -1 && r[phoneIdx]) ? r[phoneIdx].trim() : "",
                targetJobTitle: (posIdx !== -1 && r[posIdx]) ? r[posIdx].trim() : "General Application",
                level: (levelIdx !== -1 && r[levelIdx]) ? r[levelIdx].trim() : "Officer",
                branch: (branchIdx !== -1 && r[branchIdx]) ? r[branchIdx].trim() : "-",
                type: (typeIdx !== -1 && r[typeIdx]) ? r[typeIdx].trim() : "Full-Time",
                mbti: (mbtiIdx !== -1 && r[mbtiIdx]) ? r[mbtiIdx].trim() : "-",
                prescreenDate: (prescreenIdx !== -1 && r[prescreenIdx]) ? r[prescreenIdx].trim() : "",
                resumeConfirmDate: (resumeConfirmIdx !== -1 && r[resumeConfirmIdx]) ? r[resumeConfirmIdx].trim() : "",
                interviewDate: (interviewDateIdx !== -1 && r[interviewDateIdx]) ? r[interviewDateIdx].trim() : "",
                hireDate: (hireDateIdx !== -1 && r[hireDateIdx]) ? r[hireDateIdx].trim() : "",
                status: matchedStatus,
                source: (channelIdx !== -1 && r[channelIdx]) ? r[channelIdx].trim() : "LinkedIn",
                remark: (remarkIdx !== -1 && r[remarkIdx]) ? r[remarkIdx].trim() : "",
                resumeUrl: sheetDriveUrl || existingCand?.resumeUrl || "",
                assignedSlotId: existingCand?.assignedSlotId || ""
              });
            }

            if (loaded.length > 0) {
              setCandidatePool(loaded);
              if (showToast) triggerToast(`ซิงค์ข้อมูลผู้สมัครจาก Sheet สำเร็จ (${loaded.length} คน)`);
            }
          }
        } catch (err) {
          if (showToast) triggerToast("ซิงค์ไม่สำเร็จ ใช้ออฟไลน์ข้อมูลแคชเดิม");
        }
      };

      useEffect(() => {
        syncPersonnelFromGoogleSheet(false);
        syncCandidatesFromGoogleSheet(false);
      }, []);

      const departmentOptions = useMemo(() => {
        const set = new Set(DEPARTMENTS);
        personnelList.forEach(p => {
          if (p?.department && p.department !== "-" && p.department.trim()) {
            set.add(p.department.trim());
          }
        });
        return Array.from(set);
      }, [personnelList]);

      const requesterOptions = useMemo(() => {
        return personnelList.map(p => ({
          value: p.nameEn || p.name,
          label: p.nameEn ? `${p.nameEn} (${p.name})` : p.name
        }));
      }, [personnelList]);

      const supervisorOptions = useMemo(() => {
        return personnelList.map(p => ({
          value: p.nameEn || p.name,
          label: p.nameEn ? `${p.nameEn} (${p.name})` : p.name
        }));
      }, [personnelList]);

      const buddyOptions = useMemo(() => {
        return personnelList.map(p => ({
          value: p.nameEn || p.name,
          label: p.nameEn ? `${p.nameEn} (${p.name})` : p.name
        }));
      }, [personnelList]);

      const evaluatorOptions = useMemo(() => {
        return personnelList.map(p => ({
          value: p.nameEn ? `${p.nameEn} (${p.name})` : p.name,
          label: p.nameEn ? `${p.nameEn} (${p.name})` : p.name
        }));
      }, [personnelList]);
      // All position slots with individual slotStatus (Recruiting vs Closed)
      const allPositionSlots = useMemo(() => {
        return requests.flatMap(r => {
          const headcount = Math.max(1, Number(r.headcountRequired) || 1);
          const slots = (r.slots && r.slots.length === headcount) 
            ? r.slots 
            : Array.from({ length: headcount }, (_, i) => ({
                slotId: `${r.id}-${i + 1}`,
                slotIndex: i + 1,
                slotStatus: r.requestStatus || "Recruiting",
                candidateName: "",
                candidatePhone: "",
                candidateNickname: "",
                resumeUrl: "",
                stage: r.stage || "received",
                offerSentDate: "",
                hireDate: "",
                interviewSchedule: "",
                interviewScore: 0,
                interviewScorePercent: 0,
                interviewResult: "",
                onboardingArrivalStatus: r.onboardingArrivalStatus || "pending_arrival",
                rejectionReason: r.rejectionReason || "",
                evaluations: []
              }));

          return slots.map(slot => {
            const matchedCand = candidatePool.find(c => 
              (c.assignedSlotId && c.assignedSlotId === slot.slotId) || 
              (slot.candidateName && c.fullName && c.fullName.trim().toLowerCase() === slot.candidateName.trim().toLowerCase()) ||
              (slot.candidateName && c.fullName && isSameCandidate(c.fullName, slot.candidateName))
            );
            const interviewInfo = slot.interviewSchedule || matchedCand?.interviewDate || "";
            const currentEvals = slot.evaluations || [];
            const evalStats = calculateOverallScore(currentEvals);

            const isCancelled = (slot.stage || r.stage) === "cancelled";
            const arrivalStatus = isCancelled
              ? "declined_noshow"
              : (slot.onboardingArrivalStatus || r.onboardingArrivalStatus || "pending_arrival");

            // Workflow status of requisition
            const currentWorkflowStatus = slot.workflowStatus || r.workflowStatus || slot.slotStatus || r.requestStatus || "PENDING_ADMIN";
            const isPendingApproval = currentWorkflowStatus === "PENDING_ADMIN" || 
                                      currentWorkflowStatus === "PENDING_APPROVER" || 
                                      currentWorkflowStatus === "PENDING_IT";

            let initialStage = slot.stage || r.stage || "received";
            let effectiveStage = initialStage;
            if (isPendingApproval) {
              effectiveStage = "received";
            } else if ((currentWorkflowStatus === "READY_FOR_RECRUITMENT" || currentWorkflowStatus === "Recruiting") && initialStage === "received") {
              effectiveStage = "manpower";
            }

            const slotEffectiveStatus = (slot.slotStatus === "Closed" || effectiveStage === "onboarded" || effectiveStage === "cancelled")
              ? "Closed"
              : (slot.slotStatus || r.requestStatus || "Recruiting");

            const resolvedDriveUrl = slot.resumeUrl || matchedCand?.resumeUrl || matchedCand?.driveUrl || "";

            return {
              ...r,
              slotId: slot.slotId,
              slotIndex: slot.slotIndex,
              totalSlots: headcount,
              slotStatus: slotEffectiveStatus,
              workflowStatus: currentWorkflowStatus,
              requestStatus: slotEffectiveStatus,
              parentRequestId: r.id,
              candidateName: slot.candidateName || matchedCand?.fullName || "",
              candidatePhone: slot.candidatePhone || matchedCand?.phone || "",
              candidateNickname: slot.candidateNickname || matchedCand?.nickname || "",
              resumeUrl: resolvedDriveUrl,
              driveUrl: resolvedDriveUrl,
              stage: effectiveStage,
              priority: slot.priority || r.priority || "NORMAL",
              offerSentDate: slot.offerSentDate || r.offerSentDate || "",
              interviewSchedule: interviewInfo,
              interviewScore: currentEvals.length > 0 ? evalStats.combinedAvg : (slot.interviewScore || 0),
              interviewScorePercent: currentEvals.length > 0 ? evalStats.combinedPct : (slot.interviewScorePercent || 0),
              interviewResult: currentEvals.length > 0 ? evalStats.result : (slot.interviewResult || ""),
              evaluations: currentEvals,
              evaluationsCount: currentEvals.length,
              division: slot.division || r.division || "-",
              workLocation: slot.workLocation || r.workLocation || matchedCand?.branch || r.branch || "Dusit Central Park",
              replacedEmployeeName: r.replacedEmployeeName || "",
              hireDate: matchedCand?.hireDate || slot.hireDate || "",
              onboardingArrivalStatus: arrivalStatus,
              itEquipmentConfirmed: Boolean(slot.itEquipmentConfirmed),
              hasAttendedFirstDayTraining: Boolean(slot.hasAttendedFirstDayTraining || arrivalStatus === "arrived_reported"),
              rejectionReason: slot.rejectionReason || r.rejectionReason || "",
              isArchivedFromKanban: !!slot.isArchivedFromKanban,
              isItNotified: Boolean(slot.isItNotified || r.isItNotified)
            };
          });
        });
      }, [requests, candidatePool]);

      // Slot-level In Process and Closed lists
      const inProcessSlots = useMemo(() => {
        return allPositionSlots.filter(s => s.slotStatus === "Recruiting" && s.stage !== "cancelled" && s.stage !== "onboarded");
      }, [allPositionSlots]);

      const closedSlots = useMemo(() => {
        return allPositionSlots.filter(s => s.slotStatus === "Closed" || s.stage === "cancelled" || s.stage === "onboarded");
      }, [allPositionSlots]);

      const positionFilterOptions = useMemo(() => {
        const set = new Set();
        candidatePool.forEach(c => {
          if (c.targetJobTitle && c.targetJobTitle.trim()) {
            set.add(c.targetJobTitle.trim());
          }
        });
        return Array.from(set);
      }, [candidatePool]);

      const filteredCandidates = useMemo(() => {
        return candidatePool.filter(c => {
          const matchesQuery = !candidateSearchQuery.trim() ||
            c.fullName?.toLowerCase().includes(candidateSearchQuery.toLowerCase()) ||
            c.nickname?.toLowerCase().includes(candidateSearchQuery.toLowerCase()) ||
            c.phone?.includes(candidateSearchQuery) ||
            c.targetJobTitle?.toLowerCase().includes(candidateSearchQuery.toLowerCase());

          const matchesPos = candidatePositionFilter === "ALL" || c.targetJobTitle === candidatePositionFilter;
          const matchesStatus = selectedStatusFilter === "ALL" || c.status === selectedStatusFilter;

          return matchesQuery && matchesPos && matchesStatus;
        });
      }, [candidatePool, candidateSearchQuery, candidatePositionFilter, selectedStatusFilter]);

      const availableUnassignedSlots = useMemo(() => {
        return allPositionSlots.filter(s => !s.candidateName && s.stage !== "cancelled" && s.stage !== "onboarded" && s.slotStatus !== "Closed");
      }, [allPositionSlots]);

      const departmentStats = useMemo(() => {
        const statsMap = {};
        DEPARTMENTS.forEach(dept => {
          if (dept !== "-") {
            statsMap[dept] = { total: 0, open: 0, filled: 0, cancelled: 0 };
          }
        });

        allPositionSlots.forEach(s => {
          const dept = s.department;
          if (!dept || dept === "-") return;
          if (!statsMap[dept]) {
            statsMap[dept] = { total: 0, open: 0, filled: 0, cancelled: 0 };
          }

          const reqDate = new Date(s.requestDate);
          const monthStr = String(reqDate.getMonth() + 1).padStart(2, '0');
          const yearStr = String(reqDate.getFullYear());

          const matchesMonth = selectedMonthFilter === "ALL" || monthStr === selectedMonthFilter;
          const matchesYear = selectedYearFilter === "ALL" || yearStr === selectedYearFilter;

          if (matchesMonth && matchesYear) {
            statsMap[dept].total += 1;
            if (s.stage === "onboarded") {
              statsMap[dept].filled += 1;
            } else if (s.stage === "cancelled") {
              statsMap[dept].cancelled += 1;
            } else {
              statsMap[dept].open += 1;
            }
          }
        });

        return Object.entries(statsMap)
          .map(([department, counts]) => ({ department, ...counts }))
          .filter(d => d.total > 0)
          .sort((a, b) => b.total - a.total);
      }, [allPositionSlots, selectedMonthFilter, selectedYearFilter]);

      const departmentModalSlots = useMemo(() => {
        if (!selectedDepartmentDetail) return [];
        return allPositionSlots.filter(s => s.department === selectedDepartmentDetail);
      }, [allPositionSlots, selectedDepartmentDetail]);

      // Sorted Requisitions for Admin Review Queue (PENDING_ADMIN at the TOP)
      const sortedAdminRequisitions = useMemo(() => {
        const priorityWeight = {
          "PENDING_ADMIN": 1,
          "PENDING_APPROVER": 2,
          "PENDING_IT": 3,
          "READY_FOR_RECRUITMENT": 4,
          "Recruiting": 5,
          "REJECTED_BY_ADMIN": 6,
          "Closed": 7
        };

        const filtered = requests.filter(r => {
          const statusMatch = reqQueueFilter === "ALL" || (r.requestStatus || r.workflowStatus || "PENDING_ADMIN") === reqQueueFilter;
          const query = reqQueueSearch.toLowerCase().trim();
          const queryMatch = !query ||
            r.id?.toLowerCase().includes(query) ||
            r.jobTitle?.toLowerCase().includes(query) ||
            r.requesterName?.toLowerCase().includes(query) ||
            r.department?.toLowerCase().includes(query) ||
            r.approverName?.toLowerCase().includes(query);
          return statusMatch && queryMatch;
        });

        return filtered.sort((a, b) => {
          const statusA = a.requestStatus || a.workflowStatus || "PENDING_ADMIN";
          const statusB = b.requestStatus || b.workflowStatus || "PENDING_ADMIN";
          const weightA = priorityWeight[statusA] || 99;
          const weightB = priorityWeight[statusB] || 99;

          if (weightA !== weightB) {
            return weightA - weightB;
          }
          // Secondary sort: newest request date first
          return new Date(b.requestDate || 0) - new Date(a.requestDate || 0);
        });
      }, [requests, reqQueueFilter, reqQueueSearch]);

      const pendingAdminCount = useMemo(() => {
        return requests.filter(r => (r.requestStatus || r.workflowStatus || "PENDING_ADMIN") === "PENDING_ADMIN").length;
      }, [requests]);

      const handleSaveNewCandidate = async (e) => {
        e.preventDefault();
        
        // Strict Validation: Ensure all fields are filled
        const candidateValidationRules = [
          { val: newCandidateForm.fullName, name: "Full Name (ชื่อ - นามสกุล)" },
          { val: newCandidateForm.nickname, name: "Nickname (ชื่อเล่น)" },
          { val: newCandidateForm.phone, name: "Phone Number (เบอร์โทรศัพท์)" },
          { val: newCandidateForm.targetJobTitle, name: "Target Role / Position (ตำแหน่งที่สนใจ)" },
          { val: newCandidateForm.level, name: "Level (ระดับตำแหน่ง)" },
          { val: newCandidateForm.branch, name: "Branch (สาขา)" },
          { val: newCandidateForm.type, name: "Employment Type (ประเภทสัญญาจ้าง)" },
          { val: newCandidateForm.mbti, name: "MBTI (บุคลิกภาพ)" },
          { val: newCandidateForm.status, name: "Initial Status (สถานะเริ่มต้น)" },
          { val: newCandidateForm.source, name: "Application Channel / Source (ช่องทางรับสมัคร)" },
          { val: newCandidateForm.resumeUrl, name: "Google Drive Document Link - CV / Resume (ลิงก์ Google Drive เอกสารสมัครงาน)" },
          { val: newCandidateForm.remark, name: "Remarks / Notes (หมายเหตุ / ประวัติย่อ)" }
        ];

        const missing = candidateValidationRules.filter(item => {
          if (!item.val) return true;
          const s = String(item.val).trim();
          return s === "" || s === "-";
        });

        if (missing.length > 0) {
          triggerToast(`⚠️ ข้อมูลไม่ครบถ้วน: กรุณาระบุ "${missing[0].name}" (ยังเหลืออีก ${missing.length} ช่องที่ต้องตอบ)`);
          return;
        }

        const now = new Date();
        const year = String(now.getFullYear());
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const nextNo = candidatePool.length + 1;
        const candidateId = `CAND-${year}-${String(nextNo).padStart(3, '0')}`;

        const newCandObj = {
          no: nextNo,
          year,
          month,
          candidateId,
          ...newCandidateForm,
          assignedSlotId: ""
        };

        const updatedPool = [newCandObj, ...candidatePool];
        setCandidatePool(updatedPool);
        setShowAddCandidateModal(false);
        setNewCandidateForm(initialCandidateForm);

        try {
          if (googleScriptUrl) {
            await fetch(googleScriptUrl, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain" },
              body: JSON.stringify({ 
                action: "addCandidate", 
                sheetGid: "546067727",
                candidate: newCandObj 
              })
            });
            triggerToast(`เพิ่มคุณ ${newCandObj.fullName} สำเร็จ & ซิงค์ลง Google Sheet (GID 546067727) แล้ว!`);
          } else {
            triggerToast(`เพิ่มคุณ ${newCandObj.fullName} เรียบร้อย!`);
          }
        } catch (err) {
          triggerToast(`เพิ่มคุณ ${newCandObj.fullName} สำเร็จ (แคชออฟไลน์)`);
        }
      };

      const handleSelectSlotForCandidate = (slot, candidateOverride = null) => {
        const cand = candidateOverride || slotPickerCandidate;
        if (!cand) return;
        setSlotPickerCandidate(null);

        const now = new Date();
        now.setDate(now.getDate() + 3);
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const defaultDate = `${yyyy}-${mm}-${dd}`;

        let initDate = defaultDate;
        let initTime = "10:00";
        if (cand.interviewDate) {
          const parts = cand.interviewDate.split(/[T ]/);
          if (parts[0]) initDate = parts[0];
          if (parts[1]) initTime = parts[1].substring(0, 5);
        }

        setScheduleAssignModalData({ candidate: cand, targetSlot: slot });
        setScheduleInterviewDate(initDate);
        setScheduleInterviewTime(initTime || "10:00");
        setScheduleInterviewFormat("Online (google Meet)");
        setScheduleGoogleMeetUrl(cand.googleMeetUrl || "");
      };

      const handleConfirmScheduleAssign = () => {
        if (!scheduleAssignModalData || !scheduleAssignModalData.candidate || !scheduleAssignModalData.targetSlot) return;
        const { candidate, targetSlot } = scheduleAssignModalData;
        if (!scheduleInterviewDate) {
          triggerToast("⚠️ กรุณาระบุวันที่นัดสัมภาษณ์");
          return;
        }

        const dtDisplay = `${scheduleInterviewDate} ${scheduleInterviewTime || "10:00"} น.`;
        const meetUrlClean = scheduleGoogleMeetUrl ? scheduleGoogleMeetUrl.trim() : "";
        const meetSuffix = (scheduleInterviewFormat === "Online (google Meet)" && meetUrlClean) ? ` (${meetUrlClean})` : "";
        const scheduledInfo = `${dtDisplay} (${scheduleInterviewFormat})${meetSuffix}`;
        const combinedIso = `${scheduleInterviewDate}T${scheduleInterviewTime || "10:00"}`;

        setCandidatePool(prev => prev.map(c => {
          if (c.candidateId === candidate.candidateId) {
            return {
              ...c,
              assignedSlotId: targetSlot.slotId,
              interviewDate: combinedIso,
              googleMeetUrl: meetUrlClean
            };
          }
          if (c.assignedSlotId === targetSlot.slotId) {
            return { ...c, assignedSlotId: "" };
          }
          return c;
        }));

        setRequests(prev => prev.map(r => {
          if (!r.slots) return r;
          const slots = r.slots.map(s => {
            if (s.slotId === targetSlot.slotId) {
              return {
                ...s,
                candidateName: candidate.fullName,
                candidatePhone: candidate.phone,
                candidateNickname: candidate.nickname,
                resumeUrl: candidate.resumeUrl,
                stage: "interview",
                interviewSchedule: scheduledInfo,
                googleMeetUrl: meetUrlClean,
                interviewScore: 0,
                interviewScorePercent: 0,
                interviewResult: "",
                evaluations: []
              };
            }
            return s;
          });
          return { ...r, stage: "interview", slots, lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19) };
        }));

        setScheduleAssignModalData(null);
        setUnassignedInterviewSlotModal(null);
        triggerToast(`แมปคุณ ${candidate.fullName} เข้าสู่ Slot #${targetSlot.slotId} สำเร็จ`);

        // 🔄 ส่งชื่อและลิงก์ Google Drive ไปลงบันทึกในแผ่นงาน "แบบขอกำลังคน" (GID 1528284561) ทันที

          setRequests(prev => prev.map(r => {

          triggerToast(`📧 ส่งข้อมูลแจ้งทีม IT (people@valuesourcing.co) สำเร็จแล้ว! (K. ${candidateName})`);
        } catch (err) {
          triggerToast(`❌ ส่งอีเมลไม่สำเร็จ: ${err.message || err}`);

      };

      const handleUnassignCandidate = (targetSlotId, candidateFullName = "") => {
        setCandidatePool(prev => prev.map(c => {
          if (c.assignedSlotId === targetSlotId || (candidateFullName && c.fullName === candidateFullName)) {
            return { ...c, assignedSlotId: "" };
          }
          return c;
        }));

        setRequests(prev => prev.map(r => {
          if (!r.slots) return r;
          const slots = r.slots.map(s => {
            if (s.slotId === targetSlotId) {
              return {
                ...s,
                candidateName: "",
                candidatePhone: "",
                candidateNickname: "",
                resumeUrl: "",
                stage: "received",
                interviewSchedule: "",
                interviewScore: 0,
                interviewScorePercent: 0,
                interviewResult: "",
                evaluations: []
              };
            }
            return s;
          });
          return { ...r, slots, lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19) };
        }));

        setUnassignConfirmTarget(null);
        triggerToast(`ถอดรายชื่อผู้สมัครออกจาก Slot #${targetSlotId} เรียบร้อยแล้ว`);
      };

      // Handler to delete candidate with slot detachment
      const handleConfirmDeleteCandidate = () => {
        if (!candidateToDelete) return;
        const targetId = candidateToDelete.candidateId;
        const targetName = candidateToDelete.fullName;
        const linkedSlotId = candidateToDelete.assignedSlotId;

        // If candidate was assigned to a slot, detach from that slot
        if (linkedSlotId) {
          setRequests(prev => prev.map(r => {
            if (!r.slots) return r;
            const slots = r.slots.map(s => {
              if (s.slotId === linkedSlotId) {
                return {
                  ...s,
                  candidateName: "",
                  candidatePhone: "",
                  candidateNickname: "",
                  resumeUrl: "",
                  interviewSchedule: "",
                  evaluations: []
                };
              }
              return s;
            });
            return { ...r, slots };
          }));
        }

        setCandidatePool(prev => prev.filter(c => c.candidateId !== targetId));
        triggerToast(`ลบข้อมูลคุณ ${targetName} ออกจากระบบเรียบร้อย`);
        setCandidateToDelete(null);
      };

      const handleOpenBlindEvaluationModal = (slot) => {
        setBlindEvalModalSlot(slot);
        setBlindEvalForm({
          evaluatorName: "",
          evaluatorRole: EVALUATOR_ROLES[0],
          date: new Date().toISOString().split('T')[0],
          scores: { c1: 4, c2: 4, c3: 4, c4: 4, c5: 4 },
          strengths: "",
          improvements: "",
          recommendation: "Recommend to Hire"
        });
      };

      const handleSaveBlindEvaluation = (e) => {
        e.preventDefault();
        if (!blindEvalModalSlot) return;
        if (!blindEvalForm.evaluatorName.trim()) {
          triggerToast("⚠️ กรุณาระบุชื่อผู้ประเมิน");
          return;
        }
        if (!blindEvalForm.strengths.trim()) {
          triggerToast("⚠️ กรุณาระบุจุดเด่นของผู้สมัคร (บังคับกรอกทุกข้อ)");
          return;
        }
        if (!blindEvalForm.improvements.trim()) {
          triggerToast("⚠️ กรุณาระบุข้อควรพัฒนา (บังคับกรอกทุกข้อ)");
          return;
        }
        if (!blindEvalForm.recommendation.trim()) {
          triggerToast("⚠️ กรุณาระบุข้อเสนอแนะสรุปผล (บังคับกรอกทุกข้อ)");
          return;
        }

        const sc = blindEvalForm.scores;
        const total = Number(sc.c1) + Number(sc.c2) + Number(sc.c3) + Number(sc.c4) + Number(sc.c5);
        const avg = parseFloat((total / 5).toFixed(1));
        const pct = Math.round((total / 25) * 100);

        const newSubmission = {
          id: `eval-${Date.now()}`,
          evaluatorName: blindEvalForm.evaluatorName.trim(),
          evaluatorRole: blindEvalForm.evaluatorRole,
          date: blindEvalForm.date,
          scores: { ...sc },
          total,
          avg,
          pct,
          strengths: blindEvalForm.strengths,
          improvements: blindEvalForm.improvements,
          recommendation: blindEvalForm.recommendation
        };

        setRequests(prev => prev.map(r => {
          if (!r.slots) return r;
          const slots = r.slots.map(s => {
            if (s.slotId === blindEvalModalSlot.slotId) {
              const updatedEvals = [...(s.evaluations || []), newSubmission];
              const overall = calculateOverallScore(updatedEvals);
              return {
                ...s,
                interviewScore: overall.combinedAvg,
                interviewScorePercent: overall.combinedPct,
                interviewResult: overall.result,
                evaluations: updatedEvals
              };
            }
            return s;
          });
          return { ...r, slots, lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19) };
        }));

        setBlindEvalModalSlot(null);
        triggerToast(`บันทึกผลการประเมินของคุณ ${newSubmission.evaluatorName} สำเร็จ!`);
      };

      // ฟังก์ชันยืนยันความพร้อมอุปกรณ์ IT ในสเตจ Onboarded
      const handleToggleITEquipmentConfirmed = (slotId) => {
        setRequests(prev => prev.map(r => {
          if (!r.slots) return r;
          const slots = r.slots.map(s => {
            if (s.slotId === slotId) {
              const nextState = !s.itEquipmentConfirmed;
              return { ...s, itEquipmentConfirmed: nextState };
            }
            return s;
          });
          return { ...r, slots };
        }));

        setSelectedDetailSlot(prev => {
          if (!prev || prev.slotId !== slotId) return prev;
          return { ...prev, itEquipmentConfirmed: !prev.itEquipmentConfirmed };
        });

        triggerToast("💻 อัปเดตสถานะความพร้อมอุปกรณ์ IT เรียบร้อยแล้ว");
      };

      // ฟังก์ชันส่งข้อมูล Slot ที่ Closed ไปบันทึกลง Google Sheet แผ่นงาน Closed (GID 396528947) พร้อมลิงก์ Drive
      const syncSlotToClosedSheet = async (slotItem, silent = false) => {
        if (!slotItem) return;
        const targetUrl = googleScriptUrl || DEFAULT_APPS_SCRIPT_WEBAPP_URL;

        const cand = candidatePool.find(c => 
          (c.assignedSlotId && (c.assignedSlotId === slotItem.slotId || c.assignedSlotId === slotItem.parentRequestId)) || 
          (slotItem.candidateName && c.fullName && isSameCandidate(c.fullName, slotItem.candidateName)) ||
          (slotItem.candidateNickname && c.nickname && c.nickname.trim() === slotItem.candidateNickname.trim())
        );

        const resolvedDrive = String(slotItem.resumeUrl || slotItem.driveUrl || cand?.resumeUrl || cand?.driveUrl || "").trim();
        const candidateName = slotItem.candidateName || cand?.fullName || "";
        const candidatePhone = slotItem.candidatePhone || cand?.phone || "-";
        const hireDate = slotItem.hireDate || cand?.hireDate || new Date().toISOString().split('T')[0];
        const duration = getRecruitmentDurationInfo(slotItem.requestDate, hireDate, slotItem.lastUpdated);

        try {
          await fetch(targetUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              action: "archiveClosedSlot",
              sheetGid: "396528947",
              slotId: slotItem.slotId,
              reqId: slotItem.parentRequestId || slotItem.id,
              requestDate: slotItem.requestDate,
              hireDate: hireDate,
              totalDays: duration.totalDays,
              jobTitle: slotItem.jobTitle,
              department: slotItem.department,
              candidateName: candidateName,
              candidatePhone: candidatePhone,
              workLocation: slotItem.workLocation || cand?.branch || slotItem.branch || "Dusit Central Park",
              arrivalStatus: slotItem.onboardingArrivalStatus || "arrived_reported",
              interviewScore: slotItem.interviewScore || "",
              interviewScorePercent: slotItem.interviewScorePercent || 0,
              interviewResult: slotItem.interviewResult || "",
              requesterName: slotItem.requesterName || "",
              remark: slotItem.rejectionReason || "ปิดการสรรหาเรียบร้อยแล้ว (Closed)",
              driveUrl: resolvedDrive,
              resumeUrl: resolvedDrive
            })
          });

          if (!silent) {
            triggerToast(`✅ ซิงค์ Slot #${slotItem.slotId} พร้อมลิงก์ Drive ลง Sheet Closed สำเร็จ!`);
          }
        } catch (err) {
          if (!silent) triggerToast("❌ เกิดข้อผิดพลาดในการซิงค์: " + (err.message || err));
        }
      };

      // 🔄 ฟังก์ชันส่งชื่อผู้สมัครและลิงก์ Google Drive ไปบันทึกลงแผ่นงาน "แบบขอกำลังคน" (GID 1528284561)
      const syncSlotToManpowerSheet = async (slotItem, silent = false) => {
        if (!slotItem) return;
        if (!googleScriptUrl) {
          if (!silent) triggerToast("⚠️ กรุณาระบุ Google Apps Script Web App URL ก่อน");
          return;
        }

        const cand = candidatePool.find(c => 
          (c.assignedSlotId && c.assignedSlotId === slotItem.slotId) || 
          (slotItem.candidateName && c.fullName && cleanCandidateName(c.fullName).toLowerCase() === cleanCandidateName(slotItem.candidateName).toLowerCase())
        );

        const resolvedDrive = slotItem.resumeUrl || cand?.resumeUrl || cand?.driveUrl || "";
        const candidateName = slotItem.candidateName || cand?.fullName || "";
        const candidatePhone = slotItem.candidatePhone || cand?.phone || "";

        try {
          await fetch(googleScriptUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              action: "updateRequisitionCandidate",
              sheetGid: "1528284561",
              slotId: slotItem.slotId,
              reqId: slotItem.parentRequestId || slotItem.id,
              id: slotItem.parentRequestId || slotItem.id,
              candidateName: candidateName,
              candidatePhone: candidatePhone,
              jobTitle: slotItem.jobTitle,
              department: slotItem.department,
              driveUrl: resolvedDrive,
              resumeUrl: resolvedDrive
            })
          });

          if (!silent) {
            triggerToast(`✅ ซิงค์ลิงก์ Drive ของ K. ${candidateName} ลง Sheet แบบขอกำลังคน (GID 1528284561) เรียบร้อย!`);
          }
        } catch (err) {
          if (!silent) triggerToast("❌ เกิดข้อผิดพลาดในการซิงค์: " + (err.message || err));
        }
      };

      // 🔄 ซิงค์ทุกลิงก์ Drive ของตำแหน่งที่มีผู้สมัครลง Sheet แบบขอกำลังคน (GID 1528284561)
      const handleSyncAllManpowerToSheet = async () => {
        const slotsWithCandidates = allPositionSlots.filter(s => s.candidateName);
        if (slotsWithCandidates.length === 0) {
          triggerToast("ไม่มีตำแหน่งที่มีรายชื่อผู้สมัครให้ซิงค์");
          return;
        }
        triggerToast(`⏳ กำลังซิงค์ลิงก์ Drive ทั้งหมด (${slotsWithCandidates.length} รายการ) ลง Sheet แบบขอกำลังคน...`);
        for (const s of slotsWithCandidates) {
          await syncSlotToManpowerSheet(s, true);
        }
        triggerToast(`🎉 ซิงค์ผู้สมัครและลิงก์ Drive ทุกรายการลง Sheet แบบขอกำลังคน (GID 1528284561) เรียบร้อย!`);
      };

      // ซิงค์ทุกรายการใน Closed ลง Sheet Closed (GID 396528947)
      const handleSyncAllClosedToSheet = async () => {
        if (closedSlots.length === 0) {
          triggerToast("ไม่มีรายการ Closed ให้ซิงค์");
          return;
        }
        triggerToast(`⏳ กำลังซิงค์ ${closedSlots.length} รายการพร้อมลิงก์ Drive เข้า Sheet Closed...`);
        for (const s of closedSlots) {
          await syncSlotToClosedSheet(s, true);
        }
        triggerToast(`🎉 ซิงค์รายการ Closed ทั้งหมด (${closedSlots.length} รายการ) ลง Sheet Closed (GID 396528947) เรียบร้อย!`);
      };

      // อัปเดต Priority ของ Slot แบบระบุเองได้
      const handleUpdateSlotPriority = (slotId, newPriority) => {
        setRequests(prev => prev.map(r => {
          if (!r.slots) return r;
          const slots = r.slots.map(s => s.slotId === slotId ? { ...s, priority: newPriority } : s);
          return { ...r, slots };
        }));
        setSelectedDetailSlot(prev => prev?.slotId === slotId ? { ...prev, priority: newPriority } : prev);
        triggerToast(`ปรับระดับความสำคัญเป็น: ${newPriority}`);
      };

      // Individual Slot Status Update with Strict Training Attendance Gatekeeper
      const handleUpdateSlotStatus = (slotId, newStatus) => {
        const slotItem = allPositionSlots.find(s => s.slotId === slotId);

        // 🔒 เงื่อนไขสำคัญ: ถ้าจะปรับเป็น Closed แต่ผู้สมัครยังไม่ได้ติ๊กยืนยันว่ามาเริ่มงาน/อบรมวันแรก ให้บล็อกไว้ทันที
        if (newStatus === "Closed" && slotItem?.stage === "onboarded") {
          if (!slotItem.hasAttendedFirstDayTraining && slotItem.onboardingArrivalStatus !== "arrived_reported") {
            triggerToast("⚠️ ไม่สามารถปิดจบได้: ต้องติ๊กยืนยันว่าผู้สมัครมาเริ่มงาน/เข้าอบรมวันแรกเรียบร้อยก่อน");
            return;
          }
        }

        // 🔄 หากปรับสถานะเป็น Closed ให้ซิงค์ลง Sheet Closed (GID 396528947) และ Sheet ขอกำลังคน (GID 1528284561) อัตโนมัติทันที
        if (newStatus === "Closed" && slotItem) {
          const matchedCand = candidatePool.find(c => 
            (c.assignedSlotId && c.assignedSlotId === slotItem.slotId) || 
            (slotItem.candidateName && c.fullName && cleanCandidateName(c.fullName).toLowerCase() === cleanCandidateName(slotItem.candidateName).toLowerCase())
          );
          const resolvedDrive = slotItem.resumeUrl || matchedCand?.resumeUrl || matchedCand?.driveUrl || "";
          const resolvedName = slotItem.candidateName || matchedCand?.fullName || "";
          const resolvedPhone = slotItem.candidatePhone || matchedCand?.phone || "";

          const fullClosedItem = {
            ...slotItem,
            slotStatus: "Closed",
            candidateName: resolvedName,
            candidatePhone: resolvedPhone,
            resumeUrl: resolvedDrive
          };

          syncSlotToClosedSheet(fullClosedItem, true);
          if (resolvedName) {
            syncSlotToManpowerSheet(fullClosedItem, true);
          }
        }

        setRequests(prev => prev.map(r => {
          if (!r.slots) return r;
          const updatedSlots = r.slots.map(s => {
            if (s.slotId === slotId) {
              return { ...s, slotStatus: newStatus };
            }
            return s;
          });
          const allClosed = updatedSlots.every(s => s.slotStatus === "Closed" || s.stage === "onboarded" || s.stage === "cancelled");
          return {
            ...r,
            requestStatus: allClosed ? "Closed" : "Recruiting",
            slots: updatedSlots,
            lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
          };
        }));

        triggerToast(`ปรับสถานะ Slot #${slotId} เป็น ${newStatus}`);
      };

      const handleUpdateOnboardingArrivalStatus = (slotId, newArrivalStatus) => {
        if (newArrivalStatus === "declined_noshow") {
          const slotItem = allPositionSlots.find(s => s.slotId === slotId);
          setRejectionModalData({ slotId, slotItem, isArrivalDecline: true });
          setRejectionReasonInput(slotItem?.rejectionReason || "");
          return;
        }

        setRequests(prev => prev.map(r => {
          if (!r.slots) return r;
          const slots = r.slots.map(s => {
            if (s.slotId === slotId) {
              return { ...s, onboardingArrivalStatus: newArrivalStatus };
            }
            return s;
          });
          return { ...r, slots, lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19) };
        }));

        setSelectedDetailSlot(prev => prev?.slotId === slotId ? { ...prev, onboardingArrivalStatus: newArrivalStatus } : prev);
        triggerToast(`อัปเดตสถานะการมารายงานตัวของ Slot #${slotId} เรียบร้อย`);
      };

      // ฟังก์ชันยืนยันพนักงานมาเริ่มงาน / เข้าอบรมวันแรก พร้อมปรับสถานะเป็น Closed (ปิดการสรรหา) ทันทีอัตโนมัติ
      const handleConfirmFirstDayTraining = (slotId) => {
        const targetSlot = allPositionSlots.find(s => s.slotId === slotId);

        // ค้นหาลิงก์ Google Drive และชื่อของผู้สมัครจาก Candidate Pool เพื่อส่งเข้า Sheet Closed และแบบขอกำลังคน
        const matchedCand = candidatePool.find(c => 
          (c.assignedSlotId && c.assignedSlotId === slotId) || 
          (targetSlot?.candidateName && c.fullName && cleanCandidateName(c.fullName).toLowerCase() === cleanCandidateName(targetSlot.candidateName).toLowerCase())
        );
        const driveUrlToSend = targetSlot?.resumeUrl || matchedCand?.resumeUrl || matchedCand?.driveUrl || "";
        const candidateNameToSend = targetSlot?.candidateName || matchedCand?.fullName || "";
        const candidatePhoneToSend = targetSlot?.candidatePhone || matchedCand?.phone || "-";
        const hireDateToSend = targetSlot?.hireDate || matchedCand?.hireDate || new Date().toISOString().split('T')[0];

        const payloadToSync = {
          ...targetSlot,
          candidateName: candidateNameToSend,
          candidatePhone: candidatePhoneToSend,
          resumeUrl: driveUrlToSend,
          hireDate: hireDateToSend,
          slotStatus: "Closed",
          hasAttendedFirstDayTraining: true,
          onboardingArrivalStatus: "arrived_reported"
        };

        // 🔄 ซิงค์บันทึกข้อมูลเข้า Sheet "Closed" (GID 396528947) อัตโนมัติทันที
        syncSlotToClosedSheet(payloadToSync, true);

        // 🔄 ซิงค์ชื่อและลิงก์ Drive เข้าแผ่นงาน "แบบขอกำลังคน" (GID 1528284561) อัตโนมัติทันที
        if (candidateNameToSend) {
          syncSlotToManpowerSheet(payloadToSync, true);
        }

        setRequests(prev => prev.map(r => {
          if (!r.slots) return r;
          let hasSlot = false;
          const slots = r.slots.map(s => {
            if (s.slotId === slotId) {
              hasSlot = true;
              return {
                ...s,
                hasAttendedFirstDayTraining: true,
                onboardingArrivalStatus: "arrived_reported",
                slotStatus: "Closed",
                candidateName: candidateNameToSend,
                candidatePhone: candidatePhoneToSend,
                resumeUrl: s.resumeUrl || driveUrlToSend,
                hireDate: hireDateToSend
              };
            }
            return s;
          });
          if (!hasSlot) return r;

          const allClosed = slots.every(s => s.slotStatus === "Closed" || s.stage === "onboarded" || s.stage === "cancelled");
          return {
            ...r,
            requestStatus: allClosed ? "Closed" : r.requestStatus,
            slots,
            lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
          };
        }));

        setSelectedDetailSlot(prev => {
          if (!prev || prev.slotId !== slotId) return prev;
          return {
            ...prev,
            hasAttendedFirstDayTraining: true,
            onboardingArrivalStatus: "arrived_reported",
            slotStatus: "Closed",
            candidateName: candidateNameToSend,
            candidatePhone: candidatePhoneToSend,
            resumeUrl: prev.resumeUrl || driveUrlToSend,
            hireDate: hireDateToSend
          };
        });

        triggerToast(`🎉 ยืนยันพนักงานมาเริ่มงานเรียบร้อยแล้ว & ซิงค์ข้อมูล K. ${candidateNameToSend} พร้อมลิงก์ Drive ลง Google Sheet เรียบร้อย!`);
      };

      // Individual Slot Onboard Confirmation
      const handleConfirmOnboardAndClose = (e) => {
        e.preventDefault();
        if (!onboardModalData) return;
        const { slotId, slotItem } = onboardModalData;
        const hireDate = onboardHireDateInput || new Date().toISOString().split('T')[0];

        // ค้นหาลิงก์ Drive ของผู้สมัคร
        const matchedCand = candidatePool.find(c => 
          c.assignedSlotId === slotId || 
          (slotItem?.candidateName && c.fullName && isSameCandidate(c.fullName, slotItem.candidateName))
        );
        const resolvedDriveUrl = slotItem?.resumeUrl || matchedCand?.resumeUrl || matchedCand?.driveUrl || "";
        const candidateName = slotItem?.candidateName || matchedCand?.fullName || "";
        const candidatePhone = slotItem?.candidatePhone || matchedCand?.phone || "";

        // 1. Update Candidate Pool
        setCandidatePool(prev => prev.map(c => {
          if (c.assignedSlotId === slotId || (candidateName && isSameCandidate(c.fullName, candidateName))) {
            return {
              ...c,
              hireDate: hireDate,
              status: "Hiring / Offer",
              resumeUrl: c.resumeUrl || resolvedDriveUrl,
              driveUrl: c.driveUrl || resolvedDriveUrl
            };
          }
          return c;
        }));

        // 2. Update Specific Slot to Closed and Onboarded
        setRequests(prev => prev.map(r => {
          if (!r.slots) return r;
          const targetSlot = r.slots.find(s => s.slotId === slotId);
          if (!targetSlot) return r;

          const updatedSlots = r.slots.map(s => {
            if (s.slotId === slotId) {
              return {
                ...s,
                stage: "onboarded",
                slotStatus: "Closed",
                hireDate: hireDate,
                candidateName: candidateName,
                candidatePhone: candidatePhone,
                resumeUrl: s.resumeUrl || resolvedDriveUrl,
                driveUrl: s.driveUrl || resolvedDriveUrl,
                onboardingArrivalStatus: s.onboardingArrivalStatus || "pending_arrival"
              };
            }
            return s;
          });

          const allSlotsClosed = updatedSlots.every(s => s.slotStatus === "Closed" || s.stage === "onboarded" || s.stage === "cancelled");

          return {
            ...r,
            stage: allSlotsClosed ? "onboarded" : r.stage,
            requestStatus: allSlotsClosed ? "Closed" : "Recruiting",
            slots: updatedSlots,
            lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
          };
        }));

        const payloadToSync = {
          ...slotItem,
          slotId: slotId,
          candidateName: candidateName,
          candidatePhone: candidatePhone,
          resumeUrl: resolvedDriveUrl,
          driveUrl: resolvedDriveUrl,
          hireDate: hireDate,
          slotStatus: "Closed",
          onboardingArrivalStatus: "pending_arrival"
        };

        syncSlotToClosedSheet(payloadToSync, true);

        setOnboardModalData(null);
        triggerToast(`🎉 รับเข้าทำงาน Slot #${slotId} เรียบร้อย! ซิงค์ลง Sheet Closed (GID 396528947) พร้อมลิงก์ Drive`);
      };

      // Individual Slot Rejection & Decline Confirmation (Mandatory Reason + Locked Status)
      const handleConfirmRejectionAndSave = (e) => {
        e.preventDefault();
        if (!rejectionModalData) return;
        const { slotId, isArrivalDecline } = rejectionModalData;
        const reason = rejectionReasonInput.trim();
        if (!reason) {
          triggerToast("⚠️ กรุณาระบุเหตุผลในการสละสิทธิ์ / ยกเลิกตำแหน่ง");
          return;
        }

        setRequests(prev => prev.map(r => {
          if (!r.slots) return r;
          const targetSlot = r.slots.find(s => s.slotId === slotId);
          if (!targetSlot) return r;

          const updatedSlots = r.slots.map(s => {
            if (s.slotId === slotId) {
              return {
                ...s,
                stage: isArrivalDecline ? s.stage : "cancelled",
                slotStatus: "Closed", // Individual slot closed!
                onboardingArrivalStatus: "declined_noshow", // Locked declined
                rejectionReason: reason
              };
            }
            return s;
          });

          const allSlotsClosed = updatedSlots.every(s => s.slotStatus === "Closed" || s.stage === "onboarded" || s.stage === "cancelled");

          return {
            ...r,
            stage: allSlotsClosed ? "cancelled" : r.stage,
            requestStatus: allSlotsClosed ? "Closed" : "Recruiting",
            slots: updatedSlots,
            lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
          };
        }));

        if (selectedDetailSlot && selectedDetailSlot.slotId === slotId) {
          setSelectedDetailSlot(prev => ({ 
            ...prev, 
            onboardingArrivalStatus: "declined_noshow", 
            rejectionReason: reason,
            slotStatus: "Closed"
          }));
        }

        setRejectionModalData(null);
        triggerToast(`บันทึกเหตุผลเรียบร้อย! ล็อกสถานะเป็น "❌ สละสิทธิ์ / ไม่มาเริ่มงาน" สีแดง และปิด Slot #${slotId}`);
      };

      // Direct Stage Update
      const updateSlotStageDirectly = (targetSlotId, targetStage) => {
        const todayStr = new Date().toISOString().split('T')[0];

        setRequests(prev => prev.map(r => {
          const headcount = Math.max(1, Number(r.headcountRequired) || 1);
          let slots = r.slots && r.slots.length === headcount ? [...r.slots] : Array.from({ length: headcount }, (_, i) => ({
            slotId: `${r.id}-${i + 1}`,
            slotIndex: i + 1,
            slotStatus: r.requestStatus || "Recruiting",
            candidateName: "",
            stage: r.stage || "received",
            offerSentDate: "",
            interviewScore: 0,
            interviewScorePercent: 0,
            interviewResult: "",
            onboardingArrivalStatus: "pending_arrival",
            rejectionReason: "",
            evaluations: []
          }));

          let slotUpdated = false;
          slots = slots.map(s => {
            if (s.slotId === targetSlotId) {
              slotUpdated = true;
              const isNowOffer = targetStage === "offer";
              const isNowCancelled = targetStage === "cancelled";
              return {
                ...s,
                stage: targetStage,
                slotStatus: isNowCancelled ? "Closed" : s.slotStatus,
                offerSentDate: isNowOffer ? (s.offerSentDate || todayStr) : s.offerSentDate,
                onboardingArrivalStatus: isNowCancelled ? "declined_noshow" : s.onboardingArrivalStatus
              };
            }
            return s;
          });

          if (slotUpdated) {
            const allSlotsClosed = slots.every(s => s.slotStatus === "Closed" || s.stage === "onboarded" || s.stage === "cancelled");
            return {
              ...r,
              requestStatus: allSlotsClosed ? "Closed" : "Recruiting",
              offerSentDate: targetStage === "offer" ? (r.offerSentDate || todayStr) : r.offerSentDate,
              slots,
              lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };
          }
          return r;
        }));

        triggerToast(`อัปเดต Slot #${targetSlotId} เป็น ${targetStage}`);
      };

      // Stage Transition Gatekeeper (Trigger Modals for Interview / Onboarded / Cancelled)
      const handleInitiateStageChange = (slotId, targetStage) => {
        const slotItem = allPositionSlots.find(s => s.slotId === slotId);
        if (!slotItem) return;

        // If moving to interview stage but candidate has not been assigned yet
        if (targetStage === "interview" && !slotItem.candidateName) {
          setUnassignedInterviewSlotModal(slotItem);
          return;
        }

        // If moving to onboarded stage -> open Hire Date modal
        if (targetStage === "onboarded") {
          setOnboardModalData({ slotId, slotItem });
          setOnboardHireDateInput(slotItem.hireDate || new Date().toISOString().split('T')[0]);
          return;
        }

        // If moving to cancelled stage -> open Rejection Reason modal
        if (targetStage === "cancelled") {
          setRejectionModalData({ slotId, slotItem, isArrivalDecline: false });
          setRejectionReasonInput(slotItem.rejectionReason || "");
          return;
        }

        // Otherwise, perform direct stage update
        updateSlotStageDirectly(slotId, targetStage);
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();

        // 🔒 ระบบตรวจสอบความถูกต้องเข้มงวด 100% (Strict Validation: ไม่ใส่ = ไม่ให้กดยืนยัน)
        const requiredValidationRules = [
          { val: formInput.requesterName, name: "Requester Name - EN (ชื่อผู้ขอภาษาอังกฤษ)" },
          { val: formInput.requesterPosition, name: "Requester Position (ตำแหน่งผู้ขอ)" },
          { val: formInput.requesterEmail, name: "Requester Email (อีเมลผู้ขอ)" },
          { val: formInput.department, name: "Department (ฝ่ายงาน)" },
          { val: formInput.division, name: "Division (สายงาน)" },
          { val: formInput.candidateSupervisor, name: "Candidate Supervisor - EN (หัวหน้างานของ Candidate)" },
          { val: formInput.approverName, name: "Approver Name (ชื่อผู้อนุมัติ)" },
          { val: formInput.approverEmail, name: "Approver Email (อีเมลผู้อนุมัติ)" },
          { val: formInput.jobTitle, name: "Job Title (ชื่อตำแหน่งงานที่ต้องการรับ)" },
          { val: formInput.headcountRequired, name: "Headcount Required (จำนวนอัตรา)" },
          { val: formInput.positionType, name: "Position Type (ประเภทตำแหน่ง)" },
          { val: formInput.targetDate, name: "Target Start Date (ต้องการให้เริ่มงานภายในวันที่)" },
          { val: formInput.buddy, name: "Buddy / Mentor - EN (พี่เลี้ยงภาษาอังกฤษ)" },
          { val: formInput.workLocation, name: "Work Location (สถานที่ปฏิบัติงาน)" },
          { val: formInput.gender, name: "Gender (เพศ)" },
          { val: formInput.age, name: "Age Range (ช่วงอายุ)" },
          { val: formInput.educationLevel, name: "Education Level (ระดับการศึกษา)" },
          { val: formInput.major, name: "Major / Field of Study (สาขาวิชา)" },
          { val: formInput.experience, name: "Work Experience (ประสบการณ์ทำงาน)" },
          { val: formInput.mustHaveQualifications, name: "Must-Have Qualifications (คุณสมบัติจำเป็น)" },
          { val: formInput.jobDescription, name: "Job Description (ลักษณะงานโดยย่อ)" },
          { val: formInput.itLaptop, name: "Laptop / PC Requirement (ความต้องการคอมพิวเตอร์)" },
          { val: formInput.itSimCard, name: "Sim Card Requirement (ความต้องการซิมการ์ด)" },
          { val: formInput.itEmail, name: "Corporate Email Requirement (ความต้องการอีเมลองค์กร)" },
          { val: formInput.itNetsuite, name: "ERP Netsuite Requirement (ความต้องการสิทธิ์ Netsuite)" }
        ];

        // กรณีเป็น Replacement บังคับระบุชื่อพนักงานที่ถูกทดแทนด้วย
        if (formInput.positionType === "Replacement") {
          requiredValidationRules.push({
            val: formInput.replacedEmployeeName,
            name: "Replaced Employee Name (ชื่อพนักงานเดิมที่ถูกทดแทน)"
          });
        }

        const missingFields = requiredValidationRules.filter(item => {
          if (!item.val) return true;
          const s = String(item.val).trim();
          return s === "" || s === "-";
        });

        if (missingFields.length > 0) {
          triggerToast(`⚠️ ข้อมูลไม่ครบถ้วน: กรุณาระบุ "${missingFields[0].name}" (ยังเหลืออีก ${missingFields.length} ช่องที่ต้องตอบ)`);
          return;
        }

        // Open Confirmation Preview Modal when all fields are 100% valid
        setPendingConfirmationForm({ ...formInput });
        setShowConfirmModal(true);
      };

      const handleConfirmFinalSubmit = () => {
        if (!pendingConfirmationForm) return;

        const now = new Date();
        const dateStr = now.toISOString().split('T')[0];
        const timeStr = now.toTimeString().split(' ')[0];
        const newId = `REQ-${now.getFullYear()}-${String(requests.length + 1).padStart(3, '0')}`;
        const headcount = Math.max(1, Number(pendingConfirmationForm.headcountRequired) || 1);

        const newSlots = Array.from({ length: headcount }, (_, i) => ({
          slotId: `${newId}-${i + 1}`,
          slotIndex: i + 1,
          slotStatus: "PENDING_ADMIN",
          candidateName: "",
          candidatePhone: "",
          candidateNickname: "",
          resumeUrl: "",
          stage: "received",
          offerSentDate: "",
          hireDate: "",
          interviewScore: 0,
          interviewScorePercent: 0,
          interviewResult: "",
          onboardingArrivalStatus: "pending_arrival",
          rejectionReason: "",
          evaluations: []
        }));

        const newReq = {
          ...pendingConfirmationForm,
          id: newId,
          headcountRequired: headcount,
          requestDate: dateStr,
          lastUpdated: `${dateStr} ${timeStr}`,
          stage: "received",
          offerSentDate: "",
          requestStatus: "PENDING_ADMIN",
          workflowStatus: "PENDING_ADMIN",
          onboardingArrivalStatus: "pending_arrival",
          rejectionReason: "",
          slots: newSlots
        };

        // 🔄 ส่งข้อมูลคำขอไปยัง Google Sheet "แบบขอกำลังคน" (GID 1528284561)
        if (googleScriptUrl) {
          fetch(googleScriptUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              action: "createRequisition",
              sheetGid: "1528284561",
              ...newReq
            })
          }).catch(err => console.error("Error creating requisition in sheet:", err));
        }

        setRequests([newReq, ...requests]);
        setShowConfirmModal(false);
        setShowRequestModal(false);
        setPendingConfirmationForm(null);
        setFormInput(initialForm);
        triggerToast("🎉 ส่งคำขอกำลังคนสำเร็จ & บันทึกลง Sheet แบบขอกำลังคน (GID 1528284561) เรียบร้อย!");
      };

      // Admin Review: Transition immediately to READY_FOR_RECRUITMENT and move to manpower stage (No email)
      const handleAdminApproveAndMoveToManpower = async (reqOrSlot) => {
        const parentReqId = reqOrSlot.parentRequestId || reqOrSlot.id;
        const targetReq = requests.find(r => r.id === parentReqId) || reqOrSlot;

        try {
          setIsApprovingEmailSending(true);
          triggerToast(`⏳ กำลังอนุมัติคำขอ ${parentReqId} และเริ่มกระบวนการสรรหา...`);

          const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 19);

          // Update state of requests to READY_FOR_RECRUITMENT and stage to manpower
          setRequests(prev => prev.map(r => {
            if (r.id === parentReqId) {
              const updatedSlots = (r.slots || []).map(s => ({
                ...s,
                slotStatus: "READY_FOR_RECRUITMENT",
                workflowStatus: "READY_FOR_RECRUITMENT",
                stage: "manpower"
              }));
              return {
                ...r,
                requestStatus: "READY_FOR_RECRUITMENT",
                workflowStatus: "READY_FOR_RECRUITMENT",
                stage: "manpower",
                slots: updatedSlots,
                lastUpdated: nowStr
              };
            }
            return r;
          }));

          // Background sync to Google Sheet if configured (without sending email)
          if (googleScriptUrl) {
            fetch(googleScriptUrl, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain" },
              body: JSON.stringify({
                action: "confirmITReady",
                reqId: parentReqId
              })
            }).catch(() => {});
          }

          setShowAdminReviewModal(false);
          setSelectedAdminReviewSlot(null);
          if (selectedRequisitionDetail && selectedRequisitionDetail.id === parentReqId) {
            setSelectedRequisitionDetail(prev => ({
              ...prev,
              requestStatus: "READY_FOR_RECRUITMENT",
              workflowStatus: "READY_FOR_RECRUITMENT",
              stage: "manpower"
            }));
          }
          triggerToast(`✅ ยืนยันรับข้อมูลเรียบร้อย! ปรับสถานะเป็น READY_FOR_RECRUITMENT และย้ายคำขอเข้าสู่ 1. Manpower Request บน Kanban ทันที`);
        } catch (err) {
          triggerToast("บันทึกสถานะเป็น READY_FOR_RECRUITMENT เรียบร้อยแล้ว");
        } finally {
          setIsApprovingEmailSending(false);
        }
      };

      // Admin Action: Reject Requisition with Reason
      const handleAdminRejectRequisition = (reqId) => {
        if (!rejectionNoteInput.trim()) {
          triggerToast("⚠️ กรุณาระบุเหตุผลการตีกลับหรือปฏิเสธคำขอ");
          return;
        }

        const reason = rejectionNoteInput.trim();
        setRequests(prev => prev.map(r => {
          if (r.id === reqId) {
            const updatedSlots = (r.slots || []).map(s => ({
              ...s,
              slotStatus: "REJECTED_BY_ADMIN",
              workflowStatus: "REJECTED_BY_ADMIN",
              stage: "cancelled",
              rejectionReason: reason
            }));
            return {
              ...r,
              requestStatus: "REJECTED_BY_ADMIN",
              workflowStatus: "REJECTED_BY_ADMIN",
              stage: "cancelled",
              rejectionReason: reason,
              slots: updatedSlots,
              lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };
          }
          return r;
        }));

        if (selectedRequisitionDetail && selectedRequisitionDetail.id === reqId) {
          setSelectedRequisitionDetail(prev => ({
            ...prev,
            requestStatus: "REJECTED_BY_ADMIN",
            workflowStatus: "REJECTED_BY_ADMIN",
            rejectionReason: reason
          }));
        }

        setShowRejectModal(false);
        setRejectionNoteInput("");
        triggerToast(`❌ ตีกลับคำขอ ${reqId} เรียบร้อยแล้ว`);
      };

      const handleCopyShareLink = () => {
        const baseUrl = window.location.href.split('?')[0];
        const textArea = document.createElement("textarea");
        textArea.value = baseUrl;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        triggerToast("คัดลอกลิงก์สำเร็จ! 🔗");
      };

      const exportToCSV = () => {
        const headers = [
          "Slot ID", "Request ID", "Date", "Slot Status", "Job Title", "Position Type", "Replaced Name",
          "Department", "Stage", "Working Days Elapsed", "Total Recruitment Days", "Candidate", "Interview Schedule",
          "Evaluations Count", "Combined Score (1-5)", "Score %", "Result", "Hire Date", "Arrival Status", "Rejection Reason"
        ];
        const rows = allPositionSlots.map(s => {
          const sla = getSLAInfo(s.requestDate, s.stage, s.offerSentDate);
          const duration = getRecruitmentDurationInfo(s.requestDate, s.hireDate, s.lastUpdated);
          return [
            s.slotId, s.id, s.requestDate, s.slotStatus, `"${s.jobTitle}"`, s.positionType,
            `"${s.replacedEmployeeName || ''}"`, `"${s.department}"`, s.stage,
            sla.offerLeadTimeWorkingDays !== null ? sla.offerLeadTimeWorkingDays : sla.workingDaysElapsed,
            duration.totalDays,
            `"${s.candidateName || ''}"`, `"${s.interviewSchedule || ''}"`,
            s.evaluationsCount || 0,
            s.interviewScore || "", s.interviewScorePercent ? `${s.interviewScorePercent}%` : "", s.interviewResult || "",
            `"${s.hireDate || ''}"`, `"${s.onboardingArrivalStatus || ''}"`, `"${s.rejectionReason || ''}"`
          ];
        });
        const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `Manpower_Report_${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };
      return (
        <div className="min-h-screen flex flex-col bg-slate-50/80 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">
          
          {/* Header - Modern Soft Tone & Bilingual */}
          <header className="sticky top-0 z-30 border-b border-slate-200/70 dark:border-slate-800/80 bg-white/85 dark:bg-slate-900/85 glass-effect">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16 sm:h-20">
                
                <div className="flex items-center space-x-3.5">
                  <div className="w-11 h-11 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-sky-500/20 shrink-0">
                    <Icon name="users" className="w-5 h-5 text-white" />
                  </div>
                  <div>
                    <h1 className="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white flex items-center gap-2 tracking-tight">
                      <span>HR Recruitment Dashboard</span>
                    </h1>
                  </div>
                </div>

                <div className="flex items-center space-x-2 sm:space-x-3">
                  <button 
                    onClick={() => setDarkMode(!darkMode)}
                    className="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200/80 dark:border-slate-800 transition"
                    title={darkMode ? "Switch to Light Mode" : "Switch to Dark Mode"}
                  >
                    <Icon name={darkMode ? "sun" : "moon"} className="w-4 h-4" />
                  </button>

                  {/* User Profile & Role Info */}
                  {currentUser ? (
                    <div className="flex items-center gap-2">
                      <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                        {currentUser.picture ? (
                          <img src={currentUser.picture} alt="" className="w-6 h-6 rounded-full object-cover shrink-0" />
                        ) : (
                          <div className="w-6 h-6 rounded-full bg-brand-500 text-white font-bold text-xs flex items-center justify-center shrink-0">
                            {(currentUser.email || "U")[0].toUpperCase()}
                          </div>
                        )}
                        <div className="hidden md:block text-left">

                        </div>
