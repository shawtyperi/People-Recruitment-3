                              className={`px-2.5 py-1 rounded-xl text-xs font-bold transition ${
                                selectedStatusFilter === "ALL"
                                  ? "bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-xs"
                                  : "bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300"
                              }`}
                            >
                              All ({candidatePool.length})
                            </button>
                            {CANDIDATE_STATUS_CONFIG.map(st => {
                              const count = candidatePool.filter(c => c.status === st.id).length;
                              return (
                                <button
                                  key={st.id}
                                  onClick={() => setSelectedStatusFilter(st.id)}
                                  className={`px-2 py-1 rounded-xl text-xs font-bold transition border ${st.bg} ${st.text} ${st.border} ${
                                    selectedStatusFilter === st.id ? "ring-2 ring-slate-800 dark:ring-slate-200 shadow-xs" : "opacity-80 hover:opacity-100"
                                  }`}
                                >
                                  <span>{st.label}</span>
                                  <span className="ml-1 px-1.5 py-0.2 rounded-full bg-black/10 text-[10px]">{count}</span>
                                </button>
                              );
                            })}
                          </div>
                        </div>

                        <div className="relative w-full md:w-64">
                          <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                            <Icon name="search" className="w-3.5 h-3.5" />
                          </div>
                          <input
                            type="text"
                            placeholder="Search candidates..."
                            value={candidateSearchQuery}
                            onChange={(e) => setCandidateSearchQuery(e.target.value)}
                            className="w-full pl-8 pr-3 py-1.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                      </div>

                      {/* Candidate Pool Data Table */}
                    <div className="overflow-x-auto max-h-[520px] overflow-y-auto border border-slate-200 dark:border-slate-800 rounded-2xl w-full">
                        <table className="w-full text-left text-xs text-slate-600 dark:text-slate-300 whitespace-nowrap">
                          <thead className="bg-slate-100 dark:bg-slate-800 text-[10px] uppercase tracking-wider text-slate-600 dark:text-slate-400 sticky top-0 z-10 border-b border-slate-200 dark:border-slate-700">
                            <tr>
                              <th className="px-3 py-2.5 font-bold">Action</th>
                              <th className="px-3 py-2.5 font-bold">No.</th>
                              <th className="px-3 py-2.5 font-bold">Full Name</th>
                              <th className="px-3 py-2.5 font-bold">Nickname</th>
                              <th className="px-3 py-2.5 font-bold">Phone</th>
                              <th className="px-3 py-2.5 font-bold">Position</th>
                              <th className="px-3 py-2.5 font-bold">Level</th>
                              <th className="px-3 py-2.5 font-bold">Status</th>
                              <th className="px-3 py-2.5 font-bold text-center">Manage</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                            {filteredCandidates.length === 0 ? (
                              <tr>
                                <td colSpan="9" className="text-center py-8 text-slate-400 italic">
                                  ไม่พบข้อมูลผู้สมัครตามเงื่อนไขที่ค้นหา
                                </td>
                              </tr>
                            ) : (
                              filteredCandidates.map((cand, idx) => {
                                const statusCfg = CANDIDATE_STATUS_CONFIG.find(c => c.id === cand.status) || CANDIDATE_STATUS_CONFIG[0];
                                const shouldHideMapping = statusCfg.hideMapping;

                                return (
                                  <tr key={cand.candidateId} className="hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition">
                                    <td className="px-3 py-2">
                                      <div className="flex items-center gap-1.5">
                                        {/* 1. ปุ่มดูรายละเอียด/แก้ไข */}
                                        <button
                                          type="button"
                                          onClick={() => handleOpenCandidateDetail(cand)}
                                          className="p-1.5 rounded-lg bg-sky-50 hover:bg-sky-100 dark:bg-sky-950/60 dark:hover:bg-sky-900 text-sky-700 dark:text-sky-300 transition shadow-2xs border border-sky-200 dark:border-sky-800"
                                          title="ดูรายละเอียด / แก้ไขข้อมูล 18 คอลัมน์"
                                        >
                                          <Icon name="eye" className="w-3.5 h-3.5" />
                                        </button>

                                        {/* 2. ปุ่มแมปตำแหน่ง */}
                                        {cand.assignedSlotId ? (
                                          <div className="flex items-center gap-1">
                                            <span className="px-1.5 py-0.5 rounded-md bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-200 font-extrabold text-[10px] border border-emerald-300">
                                              ✓ {cand.assignedSlotId}
                                            </span>
                                            <button
                                              onClick={() => handleUnassignCandidate(cand.assignedSlotId, cand.fullName)}
                                              className="text-[10px] text-rose-600 hover:text-rose-800 underline font-semibold shrink-0"
                                              title="Unassign"
                                            >
                                              ถอด
                                            </button>
                                          </div>
                                        ) : shouldHideMapping ? (
                                          <span className="text-[10px] font-semibold italic text-slate-400 dark:text-slate-500">
                                            {cand.status === "Hiring / Offer" ? "✓ บรรจุงานแล้ว" : "(พ้นกระบวนการ)"}
                                          </span>
                                        ) : (
                                          <button
                                            onClick={() => setSlotPickerCandidate(cand)}
                                            className="p-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white transition shadow-2xs active:scale-95"
                                            title="แมปตำแหน่ง"
                                          >
                                            <Icon name="plus" className="w-3.5 h-3.5 text-white" />
                                          </button>
                                        )}
                                      </div>
                                    </td>

                                    <td className="px-3 py-2 font-bold text-slate-800 dark:text-slate-200">{cand.no || idx + 1}</td>
                                    <td className="px-3 py-2 font-bold text-slate-900 dark:text-white">
                                      <div className="flex items-center gap-1.5">
                                        <span>{cand.fullName}</span>
                                        {cand.resumeUrl && (
                                          <a
                                            href={cand.resumeUrl}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="inline-flex items-center gap-0.5 px-1.5 py-0.2 rounded bg-sky-50 dark:bg-sky-950/70 text-sky-600 dark:text-sky-300 border border-sky-200 dark:border-sky-800 text-[9px] font-semibold hover:bg-sky-100 transition shadow-2xs"
                                            title="เปิดดู Google Drive CV / Resume"
                                          >
                                            <Icon name="link" className="w-2.5 h-2.5 text-sky-500" />
                                            <span>CV</span>
                                          </a>
                                        )}
                                      </div>
                                    </td>
                                    <td className="px-3 py-2">{cand.nickname || "-"}</td>
                                    <td className="px-3 py-2">{cand.phone || "-"}</td>
                                    <td className="px-3 py-2 font-semibold text-brand-600 dark:text-brand-400">{cand.targetJobTitle}</td>
                                    <td className="px-3 py-2">{cand.level || "-"}</td>
                                    
                                    <td className="px-3 py-2">
                                      <span className={`inline-block text-[11px] font-bold px-2 py-0.5 rounded-lg border ${statusCfg.bg} ${statusCfg.text} ${statusCfg.border}`}>
                                        {statusCfg.label}
                                      </span>
                                    </td>

                                    <td className="px-3 py-2 text-center">
                                      <button
                                        type="button"
                                        onClick={() => setCandidateToDelete(cand)}
                                        className="p-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/60 dark:hover:bg-rose-900 text-rose-700 dark:text-rose-300 font-bold text-[11px] border border-rose-200 dark:border-rose-800 transition active:scale-95 shadow-2xs cursor-pointer"
                                        title="ลบข้อมูลผู้สมัครรายนี้"
                                      >
                                        <span>🗑️ ลบ</span>
                                      </button>
                                    </td>
                                  </tr>
                                );
                              })
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>

                  </div>
                )}
              </div>
            )}
              </>
            )}

          </main>

          {/* Stage Header Multi-Select Clear / Archive Modal */}
          {stageClearModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-lg bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden max-h-[90vh] flex flex-col">
                <div className="px-6 py-4 bg-gradient-to-r from-slate-900 to-slate-800 text-white flex items-center justify-between">
                  <div>
                    <span className="text-[10px] font-bold text-amber-400 uppercase tracking-wider">
                      KANBAN STAGE CLEAR / HIDE MODAL
                    </span>
                    <h3 className="text-base font-extrabold mt-0.5 flex items-center gap-1.5">
                      <span>🧹 ล้างการ์ดในด่าน: {stageClearModal.stageLabel}</span>
                    </h3>
                  </div>
                  <button onClick={() => setStageClearModal(null)} className="p-1.5 text-slate-400 hover:text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-4 bg-amber-50 dark:bg-amber-950/40 border-b border-amber-200 dark:border-amber-900/50 text-[11px] text-amber-800 dark:text-amber-200">
                  💡 <strong>หมายเหตุ:</strong> การล้างการ์ดจะซ่อนการ์ดที่เลือกออกจากหน้ากระดาน Kanban เท่านั้น โดยข้อมูลคำขอและ Slot ทั้งหมดยังคงถูกบันทึกและแสดงผลใน <strong>Manpower Request (แท็บ Closed)</strong> ครบถ้วน 100%
                </div>

                <div className="p-6 space-y-3 overflow-y-auto flex-1 text-xs">
                  <div className="flex items-center justify-between pb-2 border-b border-slate-200 dark:border-slate-800">
                    <label className="flex items-center gap-2 cursor-pointer font-bold text-slate-900 dark:text-white select-none">
                      <input
                        type="checkbox"
                        checked={selectedSlotsToClear.length === stageClearModal.slots.length && stageClearModal.slots.length > 0}
                        onChange={(e) => {
                          if (e.target.checked) {
                            setSelectedSlotsToClear(stageClearModal.slots.map(s => s.slotId));
                          } else {
                            setSelectedSlotsToClear([]);
                          }
                        }}
                        className="w-4 h-4 rounded text-brand-600 focus:ring-brand-500"
                      />
                      <span>เลือกทั้งหมด ({stageClearModal.slots.length} รายการ)</span>
                    </label>
                    <span className="text-[11px] text-slate-400">เลือกแล้ว {selectedSlotsToClear.length} รายการ</span>
                  </div>

                  <div className="space-y-2 max-h-64 overflow-y-auto pr-1">
                    {stageClearModal.slots.map(slot => (
                      <label
                        key={slot.slotId}
                        className={`flex items-start gap-3 p-3 rounded-xl border transition cursor-pointer select-none ${
                          selectedSlotsToClear.includes(slot.slotId)
                            ? "bg-brand-50/80 dark:bg-brand-950/40 border-brand-300 dark:border-brand-700"
                            : "bg-slate-50/50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-800 hover:bg-slate-50"
                        }`}
                      >
                        <input
                          type="checkbox"
                          checked={selectedSlotsToClear.includes(slot.slotId)}
                          onChange={() => {
                            setSelectedSlotsToClear(prev =>
                              prev.includes(slot.slotId)
                                ? prev.filter(id => id !== slot.slotId)
                                : [...prev, slot.slotId]
                            );
                          }}
                          className="w-4 h-4 mt-0.5 rounded text-brand-600 focus:ring-brand-500 shrink-0"
                        />
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-brand-600 text-xs">Slot #{slot.slotId}</span>
                            <span className="text-[10px] text-slate-400">{slot.requestDate}</span>
                          </div>
                          <p className="font-bold text-slate-900 dark:text-white truncate mt-0.5">{slot.jobTitle}</p>
                          <p className="text-[11px] text-slate-500 truncate">{slot.department}</p>
                          {slot.candidateName && (
                            <p className="text-[11px] text-emerald-700 dark:text-emerald-300 font-semibold mt-1">
                              👤 {slot.candidateName}
                            </p>
                          )}
                        </div>
                      </label>
                    ))}
                  </div>
                </div>

                <div className="p-4 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
                  <button
                    type="button"
                    onClick={() => setStageClearModal(null)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200"
                  >
                    ยกเลิก
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmBatchArchive}
                    disabled={selectedSlotsToClear.length === 0}
                    className="px-5 py-2 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 disabled:opacity-50 disabled:cursor-not-allowed shadow-md transition"
                  >
                    ล้างตำแหน่งที่เลือก ({selectedSlotsToClear.length} รายการ)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Unassigned Interview Slot Alert & Picker Modal */}
          {unassignedInterviewSlotModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-amber-300 dark:border-amber-700 p-6 space-y-4">
                <div className="flex items-start justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
                  <div className="flex items-center gap-2">
                    <div className="w-10 h-10 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center text-lg font-bold shrink-0">
                      ⚠️
                    </div>
                    <div>
                      <span className="text-[10px] font-extrabold text-amber-600 uppercase">
                        INTERVIEW STAGE CANDIDATE CHECK
                      </span>
                      <h3 className="text-base font-extrabold text-slate-900 dark:text-white mt-0.5">
                        ตำแหน่งนี้ยังไม่มีผู้สมัครจับคู่ (Unassigned)
                      </h3>
                    </div>
                  </div>
                  <button onClick={() => setUnassignedInterviewSlotModal(null)} className="p-1 text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-xs space-y-1">
                  <p><span className="text-slate-400">ตำแหน่ง:</span> <strong className="text-slate-900 dark:text-white">{unassignedInterviewSlotModal.jobTitle}</strong></p>
                  <p><span className="text-slate-400">Slot ID:</span> <strong className="text-brand-600">#{unassignedInterviewSlotModal.slotId}</strong></p>
                  <p><span className="text-slate-400">ฝ่ายงาน:</span> <strong className="text-slate-700 dark:text-slate-300">{unassignedInterviewSlotModal.department}</strong></p>
                </div>

                <p className="text-xs text-slate-600 dark:text-slate-300 font-medium">
                  ก่อนจะย้ายตำแหน่งเข้าสู่ด่าน <strong>Interview Stage</strong> กรุณาเลือกผู้สมัครจาก Candidate Pool เพื่อนำมาจับคู่และกำหนดวันเวลานัดสัมภาษณ์:
                </p>

                <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                  {candidatePool.filter(c => !c.assignedSlotId && c.status !== "not suitable" && c.status !== "cancel by candidate" && c.status !== "Hiring / Offer").length === 0 ? (
                    <div className="p-4 text-center text-slate-400 italic bg-slate-50 dark:bg-slate-800/40 rounded-xl text-xs">
                      ไม่มีผู้สมัครที่พร้อมแมปใน Candidate Pool (กรุณาเพิ่มผู้สมัครก่อน)
                    </div>
                  ) : (
                    candidatePool
                      .filter(c => !c.assignedSlotId && c.status !== "not suitable" && c.status !== "cancel by candidate" && c.status !== "Hiring / Offer")
                      .map(cand => (
                        <div
                          key={cand.candidateId}
                          onClick={() => handleSelectSlotForCandidate(unassignedInterviewSlotModal, cand)}
                          className="p-3 rounded-xl bg-slate-50 hover:bg-sky-50 dark:bg-slate-800 dark:hover:bg-sky-950/60 border border-slate-200 dark:border-slate-700 hover:border-sky-500 transition cursor-pointer flex items-center justify-between group active:scale-[0.99] select-none"
                        >
                          <div className="min-w-0 pr-2">
                            <div className="font-bold text-slate-900 dark:text-white text-xs truncate group-hover:text-sky-600">{cand.fullName}</div>
                            <div className="text-[11px] text-slate-500 dark:text-slate-400 truncate">{cand.targetJobTitle} &bull; {cand.phone || "-"}</div>
                          </div>
                          <span className="text-xs font-bold text-sky-600 bg-sky-100/80 dark:bg-sky-950 px-2.5 py-1 rounded-lg shrink-0 group-hover:bg-sky-600 group-hover:text-white transition">
                            เลือก &rarr;
                          </span>
                        </div>
                      ))
                  )}
                </div>

                <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end">
                  <button
                    type="button"
                    onClick={() => setUnassignedInterviewSlotModal(null)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition"
                  >
                    ปิดหน้าต่าง
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Schedule Interview Assignment Modal */}
          {scheduleAssignModalData && scheduleAssignModalData.candidate && scheduleAssignModalData.targetSlot && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-lg bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-sky-300 dark:border-sky-800 overflow-hidden flex flex-col max-h-[92vh]">
                
                {/* Header */}
                <div className="px-6 py-4 bg-gradient-to-r from-sky-600 to-indigo-600 text-white flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <div className="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center text-lg">
                      🗓️
                    </div>
                    <div>
                      <span className="text-[10px] font-extrabold uppercase tracking-wider text-sky-200 block">
                        CANDIDATE ASSIGNMENT &amp; SCHEDULING
                      </span>
                      <h3 className="text-sm sm:text-base font-extrabold text-white mt-0.5">
                        นัดหมายสัมภาษณ์ &amp; จับคู่ตำแหน่งงาน
                      </h3>
                    </div>
                  </div>
                  <button 
                    onClick={() => setScheduleAssignModalData(null)} 
                    className="p-1.5 text-white/80 hover:text-white rounded-lg hover:bg-white/10 transition"
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                {/* Body */}
                <div className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
                  {/* Summary Box */}
                  <div className="p-3.5 rounded-2xl bg-sky-50/70 dark:bg-sky-950/40 border border-sky-200 dark:border-sky-900/60 space-y-1.5">
                    <div className="flex items-center justify-between">
                      <span className="text-slate-500 dark:text-slate-400 text-[11px]">ผู้สมัครที่เลือก:</span>
                      <span className="font-extrabold text-sky-700 dark:text-sky-300 text-xs">
                        👤 {scheduleAssignModalData.candidate.fullName} {scheduleAssignModalData.candidate.nickname ? `(${scheduleAssignModalData.candidate.nickname})` : ''}
                      </span>
                    </div>
                    <div className="flex items-center justify-between">
                      <span className="text-slate-500 dark:text-slate-400 text-[11px]">ตำแหน่งงาน (Slot):</span>
                      <span className="font-bold text-slate-900 dark:text-white text-xs">
                        {scheduleAssignModalData.targetSlot.jobTitle} (#{scheduleAssignModalData.targetSlot.slotId})
                      </span>
                    </div>
                    <div className="flex items-center justify-between">
                      <span className="text-slate-500 dark:text-slate-400 text-[11px]">ฝ่ายงาน:</span>
                      <span className="font-semibold text-slate-700 dark:text-slate-300 text-[11px]">
                        {scheduleAssignModalData.targetSlot.department}
                      </span>
                    </div>
                  </div>

                  {/* ⚡ Live Appointment Summary Banner */}
                  {scheduleInterviewDate && (
                    <div className="p-3 rounded-2xl bg-gradient-to-r from-emerald-500/10 via-sky-500/10 to-indigo-500/10 border border-emerald-400/40 dark:border-emerald-700/50 flex items-center gap-2.5">
                      <span className="text-xl shrink-0">📌</span>
                      <div className="min-w-0 flex-1">
                        <span className="text-[10px] uppercase font-extrabold text-emerald-700 dark:text-emerald-300 tracking-wider block">
                          สรุปกำหนดการนัดหมายสัมภาษณ์
                        </span>
                        <p className="text-xs font-bold text-slate-900 dark:text-white mt-0.5 truncate">
                          {(() => {
                            const [y, m, d] = (scheduleInterviewDate || "").split("-");
                            const thaiMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
                            const mIndex = parseInt(m, 10) - 1;
                            const thaiYear = parseInt(y, 10) + 543;
                            return `${parseInt(d, 10)} ${thaiMonths[mIndex] || m} ${thaiYear} เวลา ${scheduleInterviewTime || "10:00"} น.`;
                          })()}
                        </p>
                        <span className="text-[10.5px] font-semibold text-sky-600 dark:text-sky-400 block truncate">
                          รูปแบบ: {scheduleInterviewFormat}
                        </span>
                      </div>
                    </div>
                  )}

                  {/* 1. Date Selection with 1-Click Quick Chips */}
                  <div className="space-y-1.5">
                    <div className="flex items-center justify-between">
                      <label className="text-[11px] font-bold text-slate-700 dark:text-slate-300">
                        1. วันที่นัดสัมภาษณ์ <span className="text-rose-500">*</span>
                      </label>
                      <span className="text-[10px] text-slate-400">เลือกวันด่วน หรือเลือกจากปฏิทิน</span>
                    </div>

                    {/* Quick Date Chips */}
                    <div className="flex flex-wrap gap-1.5 pb-1">
                      {[
                        { label: "⚡ พรุ่งนี้", offset: 1 },
                        { label: "อีก 2 วัน", offset: 2 },
                        { label: "อีก 3 วัน", offset: 3 },
                        { label: "อีก 5 วัน", offset: 5 },
                        { label: "สัปดาห์หน้า (+7 วัน)", offset: 7 }
                      ].map(item => {
                        const targetD = new Date();
                        targetD.setDate(targetD.getDate() + item.offset);
                        const isoStr = `${targetD.getFullYear()}-${String(targetD.getMonth() + 1).padStart(2, '0')}-${String(targetD.getDate()).padStart(2, '0')}`;
                        const isSelected = scheduleInterviewDate === isoStr;

                        return (
                          <button
                            key={item.label}
                            type="button"
                            onClick={() => setScheduleInterviewDate(isoStr)}
                            className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition active:scale-95 border ${
                              isSelected
                                ? "bg-sky-600 text-white border-sky-600 shadow-xs ring-1 ring-sky-500/30"
                                : "bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-100"
                            }`}
                          >
                            {item.label}
                          </button>
                        );
                      })}
                    </div>

                    {/* Exact Date Picker Input */}
                    <div className="relative">
                      <input
                        type="date"
                        required
                        value={scheduleInterviewDate}
                        onChange={(e) => setScheduleInterviewDate(e.target.value)}
                        className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold focus:ring-2 focus:ring-sky-500 text-xs text-slate-900 dark:text-white"
                      />
                    </div>
                  </div>

                  {/* 2. Time Selection with 1-Click Quick Chips */}
                  <div className="space-y-2 pt-2 border-t border-slate-100 dark:border-slate-800">
                    <div className="flex items-center justify-between">
                      <label className="text-[11px] font-bold text-slate-700 dark:text-slate-300">
                        2. เวลาที่นัดหมาย (08:00 - 19:00 น.) <span className="text-rose-500">*</span>
                      </label>
                      <span className="text-[10px] text-slate-400">คลิกเลือกช่วงเวลาได้ทันที</span>
                    </div>

                    {/* Time Slot Layout: Morning (08:00 - 13:00) & Afternoon (13:00 - 19:00) */}
                    <div className="space-y-2.5">
                      {/* ☀️ ช่วงเช้า: 08:00 - 13:00 น. */}
                      <div className="p-2.5 rounded-2xl bg-amber-50/50 dark:bg-amber-950/20 border border-amber-200/70 dark:border-amber-900/40 space-y-1.5">
                        <div className="flex items-center justify-between">
                          <span className="text-[11px] font-bold text-amber-800 dark:text-amber-300 flex items-center gap-1.5">
                            <span>☀️</span>
                            <span>ช่วงเช้า (08:00 - 13:00 น.)</span>
                          </span>
                          <span className="text-[9.5px] text-amber-700/80 dark:text-amber-400 font-medium">11 ช่วงเวลา</span>
                        </div>
                        <div className="grid grid-cols-4 sm:grid-cols-6 gap-1.5">
                          {["08:00", "08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "12:00", "12:30", "13:00"].map(t => (
                            <button
                              key={`morning-${t}`}
                              type="button"
                              onClick={() => setScheduleInterviewTime(t)}
                              className={`w-full py-1.5 rounded-xl text-[11px] font-mono font-bold transition-all active:scale-95 border ${
                                scheduleInterviewTime === t
                                  ? "bg-sky-600 text-white border-sky-600 shadow-sm ring-2 ring-sky-500/25 scale-[1.02]"
                                  : "bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-sky-400 hover:bg-slate-50 dark:hover:bg-slate-700"
                              }`}
                            >
                              {t}
                            </button>
                          ))}
                        </div>
                      </div>

                      {/* 🌤️ ช่วงบ่าย: 13:00 - 19:00 น. */}
                      <div className="p-2.5 rounded-2xl bg-sky-50/50 dark:bg-sky-950/20 border border-sky-200/70 dark:border-sky-900/40 space-y-1.5">
                        <div className="flex items-center justify-between">
                          <span className="text-[11px] font-bold text-sky-800 dark:text-sky-300 flex items-center gap-1.5">
                            <span>🌤️</span>
                            <span>ช่วงบ่าย (13:00 - 19:00 น.)</span>
                          </span>
                          <span className="text-[9.5px] text-sky-700/80 dark:text-sky-400 font-medium">12 ช่วงเวลา</span>
                        </div>
                        <div className="grid grid-cols-4 sm:grid-cols-6 gap-1.5">
                          {["13:30", "14:00", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "18:00", "18:30", "19:00"].map(t => (
                            <button
                              key={`afternoon-${t}`}
                              type="button"
                              onClick={() => setScheduleInterviewTime(t)}
                              className={`w-full py-1.5 rounded-xl text-[11px] font-mono font-bold transition-all active:scale-95 border ${
                                scheduleInterviewTime === t
                                  ? "bg-sky-600 text-white border-sky-600 shadow-sm ring-2 ring-sky-500/25 scale-[1.02]"
                                  : "bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-sky-400 hover:bg-slate-50 dark:hover:bg-slate-700"
                              }`}
                            >
                              {t}
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>

                    {/* Custom Time Input if needed */}
                    <div className="flex items-center justify-between pt-1">
                      <span className="text-[10.5px] text-slate-500 dark:text-slate-400">หรือระบุเวลาเจาะจงเอง:</span>
                      <input
                        type="time"
                        min="08:00"
                        max="19:00"
                        required
                        value={scheduleInterviewTime}
                        onChange={(e) => setScheduleInterviewTime(e.target.value)}
                        className="w-36 px-2.5 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold focus:ring-2 focus:ring-sky-500 text-xs text-slate-900 dark:text-white"
                      />
                    </div>
                  </div>

                  {/* 3. Format Selection: 1-Click Cards */}
                  <div className="space-y-1.5 pt-2 border-t border-slate-100 dark:border-slate-800">
                    <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300">
                      3. รูปแบบการสัมภาษณ์ <span className="text-rose-500">*</span>
                    </label>
                    <div className="grid grid-cols-2 gap-2">
                      {[
                        { id: "Online (google Meet)", label: "Online (Google Meet)", icon: "💻", desc: "สัมภาษณ์ออนไลน์ผ่าน Meet" },
                        { id: "On-site (Dusit Central Park)", label: "On-site (Dusit Central Park)", icon: "🏢", desc: "ดุสิต เซ็นทรัล พาร์ค" },
                        { id: "On-site (Headquarter)", label: "On-site (Headquarter)", icon: "🏢", desc: "สำนักงานใหญ่" },
                        { id: "On-site (Factory)", label: "On-site (Factory)", icon: "🏭", desc: "โรงงาน" }
                      ].map(item => {
                        const isSelected = scheduleInterviewFormat === item.id;
                        return (
                          <div
                            key={item.id}
                            onClick={() => setScheduleInterviewFormat(item.id)}
                            className={`p-2.5 rounded-xl border transition cursor-pointer select-none flex items-center gap-2 ${
                              isSelected
                                ? "bg-sky-50 dark:bg-sky-950/60 border-sky-500 dark:border-sky-500 ring-2 ring-sky-500/20 shadow-xs"
                                : "bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:border-slate-300"
                            }`}
                          >
                            <span className="text-lg shrink-0">{item.icon}</span>
                            <div className="min-w-0 flex-1">
                              <span className={`block text-xs font-bold truncate ${isSelected ? "text-sky-700 dark:text-sky-300" : "text-slate-800 dark:text-slate-200"}`}>
                                {item.label}
                              </span>
                              <span className="block text-[10px] text-slate-400 truncate">
                                {item.desc}
                              </span>
                            </div>
                            {isSelected && <span className="text-sky-600 font-bold text-xs shrink-0">✓</span>}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* Google Meet Link (Only for Online) */}
                  {scheduleInterviewFormat.includes("Google Meet") || scheduleInterviewFormat.includes("Online") ? (
                    <div className="pt-1">
                      <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">
                        ลิงก์ Google Meet (ถ้ามี)
                      </label>
                      <div className="relative">
                        <input
                          type="url"
                          placeholder="https://meet.google.com/xxx-xxxx-xxx"
                          value={scheduleGoogleMeetUrl}
                          onChange={(e) => setScheduleGoogleMeetUrl(e.target.value)}
                          className="w-full pl-8 pr-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-mono text-slate-900 dark:text-white focus:ring-2 focus:ring-sky-500"
                        />
                        <div className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400">
                          <Icon name="link" className="w-3.5 h-3.5" />
                        </div>
                      </div>
                    </div>
                  ) : null}

                  <div className="p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 text-[11px] text-emerald-800 dark:text-emerald-300">
                    💡 เมื่อยืนยัน ระบบจะจับคู่คุณ <strong>{scheduleAssignModalData.candidate.fullName}</strong> เข้ากับ Slot <strong>#{scheduleAssignModalData.targetSlot.slotId}</strong> และย้ายการ์ดเข้าสู่ <strong>2. Interview Stage</strong> บน Kanban ให้ทันที
                  </div>
                </div>

                {/* Footer Actions */}
                <div className="p-4 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
                  <button
                    type="button"
                    onClick={() => setScheduleAssignModalData(null)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200 hover:bg-slate-100 transition"
                  >
                    ยกเลิก
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmScheduleAssign}
                    className="px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-700 hover:to-indigo-700 shadow-md shadow-sky-500/20 active:scale-95 transition flex items-center gap-1.5"
                  >
                    <span>ยืนยันนัดสัมภาษณ์ &amp; จับคู่ตำแหน่ง</span>
                    <Icon name="checkCircle" className="w-4 h-4 text-white" />
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Candidate Full 18-Column Details & Edit Modal */}
          {selectedCandidateDetail && candidateEditForm && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center p-3 sm:p-4 bg-slate-950/75 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-2xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden max-h-[92vh] flex flex-col">
                
                {/* Modal Header */}
                <div className="px-6 py-4 bg-gradient-to-r from-slate-900 via-slate-800 to-sky-950 text-white flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-2xl bg-sky-500/20 text-sky-300 flex items-center justify-center text-lg font-bold border border-sky-400/30 shadow-inner">
                      👤
                    </div>
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="text-[10px] font-extrabold uppercase tracking-wider text-sky-400">
                          {selectedCandidateDetail.candidateId || `CAND-2026-${String(selectedCandidateDetail.no || 1).padStart(3, '0')}`}
                        </span>
                        <span className="text-[10px] text-slate-400 font-semibold">&bull; ลำดับที่ (No.) #{selectedCandidateDetail.no || '-'}</span>
                      </div>
                      <h3 className="text-base sm:text-lg font-extrabold text-white leading-tight">
                        {isEditingCandidate ? "แก้ไขข้อมูลผู้สมัคร" : `${selectedCandidateDetail.fullName} ${selectedCandidateDetail.nickname ? `(${selectedCandidateDetail.nickname})` : ''}`}
                      </h3>
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={() => setIsEditingCandidate(!isEditingCandidate)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                        isEditingCandidate 
                          ? "bg-amber-500 hover:bg-amber-600 text-white shadow-md"
                          : "bg-white/10 hover:bg-white/20 text-sky-300 border border-sky-400/30"
                      }`}
                    >
                      <span>{isEditingCandidate ? "👁️ โหมดดูข้อมูล" : "✏️ แก้ไขข้อมูล"}</span>
                    </button>
                    <button 
                      type="button"
                      onClick={() => { setSelectedCandidateDetail(null); setIsEditingCandidate(false); }} 
                      className="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-white/10 transition cursor-pointer"
                    >
                      <Icon name="x" className="w-5 h-5" />
                    </button>
                  </div>
                </div>

                {/* Modal Body */}
                <div className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
                  {isEditingCandidate ? (
                    /* Edit Form */
                    <form id="candidateEditForm" onSubmit={handleSaveCandidateEdit} className="space-y-4">
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div className="sm:col-span-2">
                          <label className="block text-[11px] font-semibold mb-1">ชื่อ - นามสกุล *</label>
                          <input
                            type="text"
                            required
                            value={candidateEditForm.fullName}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, fullName: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">ชื่อเล่น</label>
                          <input
                            type="text"
                            value={candidateEditForm.nickname || ""}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, nickname: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">เบอร์โทรศัพท์</label>
                          <input
                            type="tel"
                            value={candidateEditForm.phone || ""}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, phone: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">ตำแหน่งที่สนใจ (Target Role) *</label>
                          <input
                            type="text"
                            required
                            value={candidateEditForm.targetJobTitle}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, targetJobTitle: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">ระดับ (Level)</label>
                          <select
                            value={candidateEditForm.level || "L3"}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, level: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold"
                          >
                            {CANDIDATE_LEVELS.map(lvl => (
                              <option key={lvl} value={lvl}>{lvl}</option>
                            ))}
                          </select>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">สาขา / Branch</label>
                          <select
                            value={candidateEditForm.branch || "Dusit Central Park"}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, branch: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                          >
                            {CANDIDATE_BRANCH_OPTIONS.map(br => (
                              <option key={br} value={br}>{br}</option>
                            ))}
                          </select>
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">ประเภท (Type)</label>
                          <select
                            value={candidateEditForm.type || "Full-Time"}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, type: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          >
                            <option value="Full-Time">Full-Time</option>
                            <option value="Contract">Contract</option>
                            <option value="Internship">Internship</option>
                          </select>
                        </div>
                        {}
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">MBTI *</label>
                          <input
                            type="text"
                            required
                            list="mbti-options-edit"
                            placeholder="พิมพ์หรือเลือก MBTI"
                            value={candidateEditForm.mbti || ""}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, mbti: e.target.value.toUpperCase() })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold font-mono text-xs uppercase"
                          />
                          <datalist id="mbti-options-edit">
                            {CANDIDATE_MBTI_OPTIONS.map(m => (
                              <option key={m} value={m} />
                            ))}
                          </datalist>
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">สถานะ (Status)</label>
                          <select
                            value={candidateEditForm.status}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, status: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold"
                          >
                            {CANDIDATE_STATUS_CONFIG.map(st => (
                              <option key={st.id} value={st.id}>{st.label}</option>
                            ))}
                          </select>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">Prescreen Date</label>
                          <input
                            type="date"
                            value={candidateEditForm.prescreenDate || ""}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, prescreenDate: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">Resume Confirm Date</label>
                          <input
                            type="date"
                            value={candidateEditForm.resumeConfirmDate || ""}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, resumeConfirmDate: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">วันเริ่มงาน (Hire Date)</label>
                          <input
                            type="date"
                            value={candidateEditForm.hireDate || ""}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, hireDate: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">แหล่งที่มา (Channel)</label>
                          <select
                            value={candidateEditForm.source || "LinkedIn"}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, source: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          >
                            <option value="LinkedIn">LinkedIn</option>
                            <option value="JobsDB">JobsDB</option>
                            <option value="JobThai">JobThai</option>
                            <option value="Facebook Page">Facebook Page</option>
                            <option value="Employee Referral">Employee Referral</option>
                            <option value="Direct Email">Direct Email</option>
                          </select>
                        </div>
                      </div>

                      <div>
                        <label className="block text-[11px] font-semibold mb-1">ลิงก์ Google Drive (CV / Resume Link)</label>
                        <div className="relative">
                          <input
                            type="url"
                            placeholder="https://drive.google.com/file/d/.../view"
                            value={candidateEditForm.resumeUrl || ""}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, resumeUrl: e.target.value })}
                            className="w-full p-2.5 pl-8 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-mono"
                          />
                          <div className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400">
                            <Icon name="link" className="w-3.5 h-3.5" />
                          </div>
                        </div>
                      </div>

                      <div>
                        <label className="block text-[11px] font-semibold mb-1">หมายเหตุ (Remark)</label>
                        <textarea
