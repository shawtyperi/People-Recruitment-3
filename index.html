  <script>
    // Suppress Babel 500KB styling notice in console
    (function() {
      const origError = console.error;
      const origWarn = console.warn;
      const filterNotice = function(...args) {
        if (args[0] && typeof args[0] === 'string' && (args[0].includes('exceeds the max of 500KB') || args[0].includes('deoptimised the styling'))) {
          return true;
        }
        return false;
      };
      console.error = function(...args) {
        if (filterNotice(...args)) return;
        origError.apply(console, args);
      };
      console.warn = function(...args) {
        if (filterNotice(...args)) return;
        origWarn.apply(console, args);
      };
    })();

    if (window.Babel && Babel.availablePresets && Babel.availablePresets.react) {
      try {
        Babel.registerPreset('react-classic', {
          presets: [
            [Babel.availablePresets.react, { runtime: 'classic' }]
          ]
        });
      } catch (err) {
        console.warn('Preset registration error:', err);
      }
    }
  </script>

    function calculateWorkingDays(startDateStr, endDateStr = null) {
      if (!startDateStr) return 0;
      const start = new Date(startDateStr);
      const end = endDateStr ? new Date(endDateStr) : new Date();
      if (isNaN(start.getTime()) || isNaN(end.getTime())) return 0;

      start.setHours(0, 0, 0, 0);
      end.setHours(0, 0, 0, 0);
      if (start > end) return 0;

      let count = 0;
      let cur = new Date(start);
      while (cur < end) {
        cur.setDate(cur.getDate() + 1);
        const day = cur.getDay();
        if (day !== 0 && day !== 6) {
          count++;
        }
      }
      return count;
    }

    const STANDARD_SLA_WORKING_DAYS = 30;

    const getSLAInfo = (requestDate, stage, offerSentDate = null) => {
      const workingDaysElapsed = calculateWorkingDays(requestDate, null);
      const workingDaysRemaining = STANDARD_SLA_WORKING_DAYS - workingDaysElapsed;
      const isCompleted = stage === "onboarded" || stage === "cancelled";
      const isOverdue = !isCompleted && workingDaysElapsed > STANDARD_SLA_WORKING_DAYS;

      let offerLeadTimeWorkingDays = null;
      if (offerSentDate) {
        offerLeadTimeWorkingDays = calculateWorkingDays(requestDate, offerSentDate);
      } else if (stage === "offer") {
        offerLeadTimeWorkingDays = workingDaysElapsed;
      }

      return { workingDaysElapsed, workingDaysRemaining, isOverdue, isCompleted, offerLeadTimeWorkingDays };
    };

    const getRecruitmentDurationInfo = (requestDate, hireDate, lastUpdated) => {
      if (!requestDate) return { rangeText: "-", totalDays: 0, workingDays: 0, closeDateStr: "-" };
      const closeDateStr = (hireDate && hireDate.trim())
        ? hireDate
        : (lastUpdated ? lastUpdated.split(' ')[0] : new Date().toISOString().split('T')[0]);

      const start = new Date(requestDate);
      const end = new Date(closeDateStr);
      let totalDays = 0;
      if (!isNaN(start.getTime()) && !isNaN(end.getTime())) {
        const diffTime = Math.max(0, end.getTime() - start.getTime());
        totalDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
      }
      const workingDays = calculateWorkingDays(requestDate, closeDateStr);
      const rangeText = `${requestDate} ถึง ${closeDateStr}`;
      return { rangeText, totalDays, workingDays, closeDateStr };
    };

    // คำนวณสถานะกำหนดการสัมภาษณ์เทียบกับวันปัจจุบัน (วันนี้, พรุ่งนี้, อีก 2-3 วันข้างหน้า)
    const getInterviewRelativeTimeInfo = (scheduleStr) => {
      if (!scheduleStr) return null;
      const match = String(scheduleStr).match(/(\d{4})-(\d{2})-(\d{2})/);
      if (!match) return null;
      const [_, y, m, d] = match;
      const interviewDate = new Date(parseInt(y, 10), parseInt(m, 10) - 1, parseInt(d, 10));
      interviewDate.setHours(0, 0, 0, 0);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const diffTime = interviewDate.getTime() - today.getTime();
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays < 0) {
        const absDays = Math.abs(diffDays);
        return {
          text: absDays === 1 ? "ผ่านมาเมื่อวาน" : `ผ่านมา ${absDays} วันแล้ว`,

          dotBg: "bg-rose-500",
          ping: true
        };
      } else if (diffDays === 1) {
        return {
          text: "🔔 พรุ่งนี้ (Tomorrow)",
          badge: "bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-200 border-amber-300 dark:border-amber-700 font-bold",
          dotBg: "bg-amber-500",
          ping: true
        };
      } else if (diffDays === 2) {
        return {
          text: "🗓️ อีก 2 วันข้างหน้า",
          badge: "bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-200 border-sky-300 dark:border-sky-700 font-bold",
          dotBg: "bg-sky-500",
          ping: false
        };
      } else if (diffDays === 3) {
        return {
          text: "🗓️ อีก 3 วันข้างหน้า",
          badge: "bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-200 border-sky-300 dark:border-sky-700 font-bold",
          dotBg: "bg-sky-500",
          ping: false
        };
      } else if (diffDays <= 7) {
        return {
          text: `🗓️ อีก ${diffDays} วันข้างหน้า`,
          badge: "bg-blue-50 text-blue-700 dark:bg-blue-950/80 dark:text-blue-300 border-blue-200 dark:border-blue-800 font-semibold",
          dotBg: "bg-blue-500",
          ping: false
        };
      } else {
        return {
          text: `🗓️ อีก ${diffDays} วัน`,
          badge: "bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300 border-slate-200 dark:border-slate-700 font-medium",

    // Helper function to extract and normalize Google Meet URLs
    const extractGoogleMeetUrl = (item) => {
      if (!item) return "";
      if (item.googleMeetUrl && typeof item.googleMeetUrl === 'string' && item.googleMeetUrl.trim()) {
        let url = item.googleMeetUrl.trim();
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
          url = 'https://' + url;
        }
        return url;
      }
      const scheduleStr = item.interviewSchedule || (typeof item === 'string' ? item : "");
      if (typeof scheduleStr === 'string') {
        const match = scheduleStr.match(/(https?:\/\/meet\.google\.com\/[a-zA-Z0-9_\-]+|meet\.google\.com\/[a-zA-Z0-9_\-]+)/);
        if (match) {
          let url = match[0];
          if (!url.startsWith('http://') && !url.startsWith('https://')) {
            url = 'https://' + url;
          }
          return url;
        }
      }
      return "";
    };

    const calculateOverallScore = (evaluations = []) => {
      if (!evaluations || evaluations.length === 0) {
        return { count: 0, combinedAvg: 0, combinedPct: 0, result: "" };
      }
      const sumAvg = evaluations.reduce((acc, ev) => acc + (Number(ev.avg) || 0), 0);
      const combinedAvg = parseFloat((sumAvg / evaluations.length).toFixed(1));
      const combinedPct = Math.round((combinedAvg / 5) * 100);
      const isPass = combinedPct >= 70;
      return {
        count: evaluations.length,
        combinedAvg,
        combinedPct,
        result: isPass ? "Pass" : "Fail"
      };
    };

    function parseCSVText(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let current = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(current.trim());
          current = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && next === '\n') i++;
          row.push(current.trim());
          if (row.some(c => c !== '')) lines.push(row);
          row = [];
          current = '';
        } else {
          current += char;
        }
      }
      if (current || row.length > 0) {
        row.push(current.trim());
        if (row.some(c => c !== '')) lines.push(row);
      }
      return lines;
    }

      useEffect(() => {

      const normalizedOptions = useMemo(() => {
        return (options || []).map(opt => typeof opt === 'object' ? opt : { value: opt, label: opt });
      }, [options]);

      const selectedOption = normalizedOptions.find(o => String(o.value) === String(value));

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setIsOpen(false);
          }

        document.addEventListener("mousedown", handleClickOutside);
        document.addEventListener("touchstart", handleClickOutside);
        return () => {
          document.removeEventListener("mousedown", handleClickOutside);
          document.removeEventListener("touchstart", handleClickOutside);

        if (!searchTerm.trim() || searchTerm.trim() === "-") return normalizedOptions;

        return normalizedOptions.filter(o =>

      }, [normalizedOptions, searchTerm]);

      };

      return (

              required={required && !value}
              placeholder={placeholder}

        return new Promise((resolve, reject) => {
          if (typeof document === "undefined") return reject(new Error("Document undefined"));
          const callbackName = "gas_cb_" + Math.round(1000000 * Math.random());
          let isResolved = false;

          const cleanup = () => {
            delete window[callbackName];
            const el = document.getElementById(callbackName);
            if (el) el.remove();
          };

          const timeoutId = setTimeout(() => {
            if (!isResolved) {
              cleanup();
              reject(new Error("JSONP Timeout"));
            }
          }, 8000);

          window[callbackName] = (data) => {
            isResolved = true;
            clearTimeout(timeoutId);
            cleanup();
            resolve(data);
          };

          const script = document.createElement("script");
          script.id = callbackName;
          script.src = `${targetUrl}?action=getWorkflowStatuses&callback=${callbackName}&_t=${Date.now()}`;
          script.onerror = () => {
            if (!isResolved) {
              clearTimeout(timeoutId);
              cleanup();
              reject(new Error("JSONP Script Error"));

                const existingMap = new Map();
                prevRequests.forEach(r => existingMap.set(r.id, r));

                remoteRequisitions.forEach(remReq => {
                  if (!existingMap.has(remReq.id)) {
                    const headcount = Math.max(1, Number(remReq.headcountRequired) || 1);
                    const slots = (remReq.slots && remReq.slots.length > 0)
                      ? remReq.slots
                      : Array.from({ length: headcount }, (_, i) => ({
                          slotId: `${remReq.id}-${i + 1}`,
                          slotIndex: i + 1,
                          slotStatus: remReq.requestStatus || "PENDING_ADMIN",
                          workflowStatus: remReq.workflowStatus || "PENDING_ADMIN",
                          stage: remReq.stage || "received",
                          candidateName: remReq.candidateName || "",
                          candidatePhone: remReq.candidatePhone || "",
                          resumeUrl: remReq.driveUrl || "",
                          driveUrl: remReq.driveUrl || "",
                          evaluations: []
                        }));
                    baseList.unshift({ ...remReq, slots });
                  }
                });
              }

              return baseList.map(r => {
                const updatedSlots = (r.slots || []).map(s => {
                  if (deletedSlots[s.slotId] || slotStages[s.slotId]?.isDeleted) {
                    return null;
                  }

                  const stageOverride = slotStages[s.slotId];
                  const itAckFromRemote = Boolean(itConfirmedSlots[s.slotId] || itConfirmedSlots[r.id]);
                  const remoteEvals = evalsMap[s.slotId] || [];

                  const newWfStatus = stageOverride?.slotStatus || s.workflowStatus;
                  const isItConfirmed = itAckFromRemote || s.itEquipmentConfirmed || Boolean(stageOverride?.itEquipmentConfirmed);
                  const effectiveStage = stageOverride?.stage || (newWfStatus === "READY_FOR_RECRUITMENT" && s.stage === "received" ? "manpower" : s.stage);

                  return {
                    ...s,
                    workflowStatus: newWfStatus || s.workflowStatus,
                    slotStatus: stageOverride?.slotStatus || s.slotStatus,
                    stage: effectiveStage,
                    priority: stageOverride?.priority || s.priority || "NORMAL",
                    candidateName: stageOverride?.candidateName !== undefined ? stageOverride.candidateName : s.candidateName,
                    candidatePhone: stageOverride?.candidatePhone !== undefined ? stageOverride.candidatePhone : s.candidatePhone,
                    candidateNickname: stageOverride?.candidateNickname !== undefined ? stageOverride.candidateNickname : s.candidateNickname,
                    interviewSchedule: stageOverride?.interviewSchedule !== undefined ? stageOverride.interviewSchedule : s.interviewSchedule,
                    googleMeetUrl: stageOverride?.googleMeetUrl !== undefined ? stageOverride.googleMeetUrl : s.googleMeetUrl,
                    hireDate: stageOverride?.hireDate !== undefined ? stageOverride.hireDate : s.hireDate,

                    evaluations: remoteEvals.length > 0 ? remoteEvals : (s.evaluations || [])
                  };
                }).filter(Boolean);

                return {
                  ...r,
                  slots: updatedSlots
                };
              });
            });

            if (!silent) {
              triggerToast("✅ ซิงค์ข้อมูลกลาง (Central Hub) เรียบร้อยแล้ว!");

      const allPositionSlots = useMemo(() => {
        return requests.flatMap(r => {
          const headcount = Math.max(1, Number(r.headcountRequired) || (r.slots?.length || 1));
          const slots = (r.slots && r.slots.length > 0) 
            ? r.slots 
            : Array.from({ length: headcount }, (_, i) => ({
                slotId: `${r.id}-${i + 1}`,

                rejectionReason: "",

            const slotWfStatus = slot.workflowStatus || slot.slotStatus || r.workflowStatus || r.requestStatus || "PENDING_ADMIN";
            const isPendingApproval = (
              slotWfStatus === "PENDING_ADMIN" || 
              slotWfStatus === "PENDING_APPROVER" || 
              slotWfStatus === "PENDING_IT"
            ) && slot.stage === "received";

              slotId: slot.slotId,
              slotIndex: actualSlotIndex,
              totalSlots: actualTotalSlots,
              slotStatus: slotEffectiveStatus,
              workflowStatus: slotWfStatus,
              requestStatus: slotEffectiveStatus,

              candidateNickname: slot.candidateNickname || matchedCand?.nickname || "",
              resumeUrl: resolvedDriveUrl,

              priority: slot.priority || r.priority || "NORMAL",

              interviewScore: currentEvals.length > 0 ? evalStats.combinedAvg : (slot.interviewScore || 0),
              interviewScorePercent: currentEvals.length > 0 ? evalStats.combinedPct : (slot.interviewScorePercent || 0),
              interviewResult: currentEvals.length > 0 ? evalStats.result : (slot.interviewResult || ""),
              evaluations: currentEvals,

              onboardingArrivalStatus: arrivalStatus,
              itEquipmentConfirmed: Boolean(slot.itEquipmentConfirmed),

        }));

        }));

          value: p.nameEn || p.name,

        }));

          value: p.nameEn ? `${p.nameEn} (${p.name})` : p.name,
          label: p.nameEn ? `${p.nameEn} (${p.name})` : p.name
        }));

      const departmentStats = useMemo(() => {
        const statsMap = {};

          if (dept !== "-") {
            statsMap[dept] = { total: 0, open: 0, filled: 0, cancelled: 0 };
          }
        });

        allPositionSlots.forEach(s => {
          const dept = s.department;
          if (!dept || dept === "-") return;
          if (!statsMap[dept]) {
            statsMap[dept] = { total: 0, open: 0, filled: 0, cancelled: 0 };
          }

          const reqDate = new Date(s.requestDate);
          const monthStr = String(reqDate.getMonth() + 1).padStart(2, '0');
          const yearStr = String(reqDate.getFullYear());

          const matchesMonth = selectedMonthFilter === "ALL" || monthStr === selectedMonthFilter;
          const matchesYear = selectedYearFilter === "ALL" || yearStr === selectedYearFilter;

          if (matchesMonth && matchesYear) {
            statsMap[dept].total += 1;
            if (s.stage === "onboarded") {
              statsMap[dept].filled += 1;
            } else if (s.stage === "cancelled") {
              statsMap[dept].cancelled += 1;
            } else {
              statsMap[dept].open += 1;
            }
          }
        });

        return Object.entries(statsMap)
          .map(([department, counts]) => ({ department, ...counts }))
          .filter(d => d.total > 0)
          .sort((a, b) => b.total - a.total);
      }, [allPositionSlots, selectedMonthFilter, selectedYearFilter]);

      const departmentModalSlots = useMemo(() => {
        if (!selectedDepartmentDetail) return [];
        return allPositionSlots.filter(s => s.department === selectedDepartmentDetail);
      }, [allPositionSlots, selectedDepartmentDetail]);

      const sortedAdminRequisitions = useMemo(() => {
        const priorityWeight = {
          "PENDING_ADMIN": 1,
          "READY_FOR_RECRUITMENT": 2,
          "Recruiting": 3,
          "REJECTED_BY_ADMIN": 4,
          "Closed": 5
        };

        const filtered = requests.filter(r => {
          const statusMatch = reqQueueFilter === "ALL" || (r.requestStatus || r.workflowStatus || "PENDING_ADMIN") === reqQueueFilter;
          const query = reqQueueSearch.toLowerCase().trim();
          const queryMatch = !query ||
            r.id?.toLowerCase().includes(query) ||
            r.jobTitle?.toLowerCase().includes(query) ||
            r.requesterName?.toLowerCase().includes(query) ||
            r.department?.toLowerCase().includes(query) ||
            r.approverName?.toLowerCase().includes(query);
          return statusMatch && queryMatch;
        });

        return filtered.sort((a, b) => {
          const statusA = a.requestStatus || a.workflowStatus || "PENDING_ADMIN";
          const statusB = b.requestStatus || b.workflowStatus || "PENDING_ADMIN";
          const weightA = priorityWeight[statusA] || 99;
          const weightB = priorityWeight[statusB] || 99;

          if (weightA !== weightB) {
            return weightA - weightB;
          }
          return new Date(b.requestDate || 0) - new Date(a.requestDate || 0);
        });
      }, [requests, reqQueueFilter, reqQueueSearch]);

      const [draggedSlotId, setDraggedSlotId] = useState(null);
      const [dragOverStage, setDragOverStage] = useState(null);

      const handleDragStart = (e, slotId) => {
        if (!isAdminAuthenticated) {
          e.preventDefault();
          return;
        }
        setDraggedSlotId(slotId);
        e.dataTransfer.setData("text/plain", slotId);
        e.dataTransfer.effectAllowed = "move";
      };

      const handleDragOver = (e, stageId) => {
        if (!isAdminAuthenticated) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        if (dragOverStage !== stageId) {
          setDragOverStage(stageId);
        }
      };

      const handleDragLeave = (e, stageId) => {
        if (e.currentTarget.contains(e.relatedTarget)) return;
        if (dragOverStage === stageId) {
          setDragOverStage(null);
        }
      };

      const handleDrop = (e, targetStage) => {
        if (!isAdminAuthenticated) return;
        e.preventDefault();
        const slotId = draggedSlotId || e.dataTransfer.getData("text/plain");
        setDragOverStage(null);
        setDraggedSlotId(null);
        if (!slotId) return;

        handleInitiateStageChange(slotId, targetStage);
      };

      const updateSlotStageDirectly = (targetSlotId, targetStage) => {
        const todayStr = new Date().toISOString().split('T')[0];

        setRequests(prev => prev.map(r => {
          if (!r.slots) return r;
          let hasModified = false;
          const slots = r.slots.map(s => {
            if (s.slotId === targetSlotId) {
              hasModified = true;
              const isNowCancelled = targetStage === "cancelled";
              const isNowOffer = targetStage === "offer";
              return {
                ...s,
                stage: targetStage,
                slotStatus: isNowCancelled ? "Closed" : (targetStage === "onboarded" ? "Closed" : s.slotStatus),
                offerSentDate: isNowOffer ? (s.offerSentDate || todayStr) : s.offerSentDate,
                onboardingArrivalStatus: isNowCancelled ? "declined_noshow" : s.onboardingArrivalStatus
              };
            }
            return s;
          });

          if (hasModified) {
            const allClosed = slots.every(s => s.slotStatus === "Closed" || s.stage === "onboarded" || s.stage === "cancelled");
            return {
              ...r,
              requestStatus: allClosed ? "Closed" : "Recruiting",
              slots,
              lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };
          }
          return r;
        }));

        sendCentralSlotStageUpdate(targetSlotId, {
          stage: targetStage,
          slotStatus: targetStage === "onboarded" || targetStage === "cancelled" ? "Closed" : "Recruiting",
          offerSentDate: targetStage === "offer" ? todayStr : undefined
        });

          setUnassignedInterviewSlotModal(slotItem);
          return;
        }

        if (targetStage === "onboarded") {
          setOnboardModalData({ slotId, slotItem });
          setOnboardHireDateInput(slotItem.hireDate || new Date().toISOString().split('T')[0]);

        setSlotPickerCandidate(null);

        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const defaultDate = `${yyyy}-${mm}-${dd}`;

        let initDate = defaultDate;
        let initTime = "10:00";
        if (cand.interviewDate) {

          if (parts[1]) initTime = parts[1].substring(0, 5);

        setScheduleInterviewDate(initDate);

          if (r.id === parentReqId && r.slots) {
            const remaining = r.slots.filter(s => s.slotId !== targetSlotId);
            return remaining.length > 0 ? { ...r, slots: remaining, headcountRequired: remaining.length } : null;
          }
          return r;
        }).filter(Boolean));

        sendCentralSlotDeletion(targetSlotId, reason);
        setSlotToDelete(null);
        setSelectedDetailSlot(null);
        triggerToast(`🗑️ ลบตำแหน่ง Slot #${targetSlotId} เรียบร้อยแล้ว`);
      };

      const handleUpdateSlotJobTitle = (slotId, newTitle) => {
        const trimmed = (newTitle || "").trim();
        if (!trimmed) {
          triggerToast("⚠️ กรุณาระบุชื่อตำแหน่งงาน");
          return;
        }

        setRequests(prev => prev.map(r => {
          if (!r.slots) return r;
          const slots = r.slots.map(s => s.slotId === slotId ? { ...s, jobTitle: trimmed } : s);
          return { ...r, slots };
        }));

        setSelectedDetailSlot(prev => prev?.slotId === slotId ? { ...prev, jobTitle: trimmed } : prev);
        setEditingCardTitleSlotId(null);
        setIsModalEditingTitle(false);
        triggerToast(`✏️ อัปเดตชื่อตำแหน่งเป็น "${trimmed}" เรียบร้อย`);
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50/80 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">
          
          {/* Header */}
          <header className="sticky top-0 z-30 border-b border-slate-200/70 dark:border-slate-800/80 bg-white/85 dark:bg-slate-900/85 glass-effect">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16 sm:h-20">
                
                <div className="flex items-center space-x-3.5">
                  <div className="w-11 h-11 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-sky-500/20 shrink-0">
                    <Icon name="users" className="w-5 h-5 text-white" />
                  </div>
                  <div>
                    <h1 className="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white flex items-center gap-2 tracking-tight">
                      <span>HR Recruitment Dashboard</span>
                    </h1>
                  </div>
                </div>

                <div className="flex items-center space-x-2 sm:space-x-3">
                  <button 
                    onClick={() => setDarkMode(!darkMode)}
                    className="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200/80 dark:border-slate-800 transition"
                    title={darkMode ? "Switch to Light Mode" : "Switch to Dark Mode"}
                  >
                    <Icon name={darkMode ? "sun" : "moon"} className="w-4 h-4" />
                  </button>

                  {/* User Profile */}
                  {currentUser ? (
                    <div className="flex items-center gap-2">
                      <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                        {currentUser.picture ? (
                          <img src={currentUser.picture} alt="" className="w-6 h-6 rounded-full object-cover shrink-0" />
                        ) : (
                          <div className="w-6 h-6 rounded-full bg-brand-500 text-white font-bold text-xs flex items-center justify-center shrink-0">
                            {(currentUser.email || "U")[0].toUpperCase()}
                          </div>
                        )}
                        <div className="hidden md:block text-left">
                          <span className="font-bold text-xs text-slate-900 dark:text-white truncate max-w-[200px] block" title={currentUser.email}>
                            {currentUser.email}
                          </span>
                        </div>
                      </div>

                      <button
                        onClick={handleUserLogout}
                        className="p-2 rounded-xl text-rose-600 bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/40 transition"
                        title="ออกจากระบบ (Logout)"
                      >
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                          <path strokeLinecap="round" strokeLinejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                      </button>
                    </div>
                  ) : null}

                  {/* Admin Only: Create Requisition button */}
                  {isAdminAuthenticated && (
                    <button
                      onClick={() => setShowRequestModal(true)}
                      className="inline-flex items-center gap-1.5 px-4 py-2 sm:px-4 sm:py-2.5 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-brand-600 to-sky-500 hover:from-brand-700 hover:to-sky-600 shadow-md shadow-brand-500/20 transition active:scale-95 cursor-pointer"
                    >
                      <Icon name="plus" className="w-4 h-4 text-white" />
                      <span className="hidden sm:inline">+ New Requisition</span>
                      <span className="sm:hidden">+ ขอกำลังคน</span>
                    </button>
                  )}

                  {/* Admin Only: Script settings */}
                  {isAdminAuthenticated && (
                    <div className="flex items-center gap-1.5">
                      <button
                        onClick={() => setShowResetConfirmModal(true)}
                        className="inline-flex items-center gap-1 px-3 py-2 rounded-xl text-xs font-bold text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-300 dark:bg-amber-950/60 dark:text-amber-300 dark:border-amber-700 transition"
                        title="ล้างข้อมูลทดสอบและรีเซ็ตระบบศูนย์กลาง"
                      >
                        <span>🧹 รีเซ็ตระบบกลาง</span>
                      </button>

                      <button
                        onClick={() => setShowSheetsModal(true)}
                        className="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200/80 dark:border-slate-800 transition"
                        title="Script Settings"
                      >
                        ⚙️
                      </button>
                    </div>
                  )}
                </div>

              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            
            {/* 🔒 Authentication Gate */}
            {!currentUser ? (
              <div className="min-h-[60vh] flex items-center justify-center py-12">
                <div className="w-full max-w-md bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-3xl p-8 sm:p-10 text-center shadow-xl shadow-slate-900/5 space-y-6">
                  
                  <div className="w-16 h-16 rounded-3xl bg-brand-50 dark:bg-brand-950/70 border border-brand-200 dark:border-brand-800 text-brand-600 flex items-center justify-center mx-auto shadow-inner">
                    <Icon name="lock" className="w-8 h-8 text-brand-600" />
                  </div>

                  <div className="space-y-2">
                    <h2 className="text-xl font-extrabold text-slate-900 dark:text-white tracking-tight">
                      Authentication Required
                    </h2>
                    <p className="text-xs text-slate-500 dark:text-slate-400 leading-relaxed max-w-xs mx-auto">
                      กรุณาลงชื่อเข้าใช้ด้วยบัญชี Google ขององค์กร (@valuesourcing.co) เพื่อเข้าถึงระบบ
                    </p>
                  </div>

                  <div className="flex flex-col items-center justify-center min-h-[46px] pt-2">
                    <div id="gateGoogleSignInBtn" className="flex justify-center"></div>
                  </div>

                  {loginError && (
                    <div className="p-3.5 rounded-2xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-900 text-rose-700 dark:text-rose-300 text-xs font-semibold leading-relaxed text-center">
                      {loginError}
                    </div>
                  )}
                </div>
              </div>
            ) : (
              <>
                {/* KPI Metrics */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                  <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/70 dark:border-slate-800 shadow-xs flex items-center justify-between">
                    <div>
                      <p className="text-[11px] text-slate-400 font-bold uppercase tracking-wider">Total Positions (อัตราทั้งหมด)</p>
                      <p className="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white mt-1">{allPositionSlots.length}</p>
                    </div>
                    <div className="w-10 h-10 rounded-xl bg-brand-50 dark:bg-brand-950 text-brand-600 flex items-center justify-center">
                      <Icon name="users" className="w-5 h-5 text-brand-600" />
                    </div>
                  </div>

                  <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/70 dark:border-slate-800 shadow-xs flex items-center justify-between">
                    <div>
                      <p className="text-[11px] text-slate-400 font-bold uppercase tracking-wider">In Progress (กำลังดำเนินการ)</p>
                      <p className="text-xl sm:text-2xl font-extrabold text-amber-600 dark:text-amber-400 mt-1">{inProcessSlots.length}</p>
                    </div>
                    <div className="w-10 h-10 rounded-xl bg-amber-50 dark:bg-amber-950 text-amber-600 flex items-center justify-center">
                      <Icon name="userSearch" className="w-5 h-5 text-amber-600" />
                    </div>
                  </div>

                  <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/70 dark:border-slate-800 shadow-xs flex items-center justify-between">
                    <div>
                      <p className="text-[11px] text-slate-400 font-bold uppercase tracking-wider">Closed Positions (ปิดการสรรหาแล้ว)</p>
                      <p className="text-xl sm:text-2xl font-extrabold text-emerald-600 dark:text-emerald-400 mt-1">{closedSlots.length}</p>
                    </div>
                    <div className="w-10 h-10 rounded-xl bg-emerald-50 dark:bg-emerald-950 text-emerald-600 flex items-center justify-center">
                      <Icon name="checkCircle" className="w-5 h-5 text-emerald-600" />
                    </div>
                  </div>

                  <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/70 dark:border-slate-800 shadow-xs flex items-center justify-between">
                    <div>
                      <p className="text-[11px] text-slate-400 font-bold uppercase tracking-wider">Candidate Pool (คลังผู้สมัคร)</p>
                      <p className="text-xl sm:text-2xl font-extrabold text-sky-600 dark:text-sky-400 mt-1">{candidatePool.length}</p>
                    </div>
                    <div className="w-10 h-10 rounded-xl bg-sky-50 dark:bg-sky-950 text-sky-600 flex items-center justify-center">
                      <Icon name="userSearch" className="w-5 h-5 text-sky-600" />
                    </div>
                  </div>
                </div>

                {/* Navigation Bar */}
                <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200/80 dark:border-slate-800 pb-3">
                  <div className="flex flex-wrap items-center gap-2">
                    {isAdminAuthenticated ? (
                      <>
                        <button
                          onClick={() => setAdminSubTab("requisitions")}
                          className={`px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 ${
                            adminSubTab === "requisitions"
                              ? "bg-brand-600 text-white shadow-md shadow-brand-500/20"
                              : "bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200/70 dark:border-slate-700 hover:bg-slate-100"
                          }`}
                        >
                          <Icon name="clipboardCheck" className="w-4 h-4" />
                          <span>1. Requisition Queue (1. คิวตรวจสอบคำขอ)</span>
                          {pendingAdminCount > 0 && (
                            <span className="px-1.5 py-0.5 rounded-full text-[10px] font-extrabold bg-rose-500 text-white animate-pulse">
                              {pendingAdminCount}
                            </span>
                          )}
                        </button>

                        <button
                          onClick={() => setAdminSubTab("kanban")}
                          className={`px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                            adminSubTab === "kanban"
                              ? "bg-brand-600 text-white shadow-md shadow-brand-500/20"
                              : "bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200/70 dark:border-slate-700 hover:bg-slate-100"
                          }`}
                        >
                          <Icon name="grid" className="w-3.5 h-3.5" />
                          <span>2. Kanban Pipeline &amp; Demand (2. กระดานและอัตรากำลังคน)</span>
                        </button>

                        <button
                          onClick={() => setAdminSubTab("candidates")}
                          className={`px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                            adminSubTab === "candidates"
                              ? "bg-slate-900 dark:bg-white text-white dark:text-slate-900 shadow-md"
                              : "bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 border border-slate-200/70 dark:border-slate-700 hover:bg-slate-100"
                          }`}
                        >
                          <Icon name="userSearch" className="w-3.5 h-3.5" />
                          <span>3. Candidate Pool &amp; Requisitions (3. คลังผู้สมัครและแบบขอกำลังคน)</span>
                        </button>
                      </>
                    ) : (
                      <div className="flex items-center gap-2">
                        <span className="px-4 py-2.5 rounded-xl text-xs font-extrabold bg-brand-600 text-white shadow-md flex items-center gap-1.5">
                          <Icon name="grid" className="w-3.5 h-3.5 text-white" />
                          <span>📋 Kanban Pipeline &amp; Evaluation (กระดานสรรหาและร่วมประเมินคะแนน)</span>
                        </span>
                        <span className="text-xs text-sky-700 dark:text-sky-300 bg-sky-50 dark:bg-sky-950/60 border border-sky-200 dark:border-sky-800 px-3 py-1.5 rounded-xl font-medium">
                          👁️ โหมดพนักงาน (View Only &bull; สามารถร่วมประเมินสัมภาษณ์ได้)
                        </span>
                      </div>
                    )}
                  </div>

                  {/* Live Status indicator */}
                  <div className="flex items-center gap-2">
                    <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-xl text-xs font-bold border shadow-2xs ${
                      syncStatus.connected
                        ? "bg-emerald-50 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-200 border-emerald-300 dark:border-emerald-700"
                        : "bg-amber-50 dark:bg-amber-950/60 text-amber-800 dark:text-amber-200 border-amber-300 dark:border-amber-700 animate-pulse"
                    }`}>
                      <span className={`w-2 h-2 rounded-full ${syncStatus.connected ? "bg-emerald-500 animate-ping" : "bg-amber-500"}`}></span>
                      <span>{syncStatus.connected ? `🟢 Live Connected (${syncStatus.lastSynced || "Real-time"})` : "⏳ Connecting to Central..."}</span>
                    </span>

                    <button
                      onClick={() => syncWorkflowStatus(false)}
                      className="p-1.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100"
                      title="ซิงค์ข้อมูลเดี๋ยวนี้"
                    >
                      <Icon name="refresh" className="w-3.5 h-3.5 text-brand-600" />
                    </button>
                  </div>
                </div>

                {adminSubTab === "kanban" && (
                  <div className="space-y-8 animate-fadeIn">
                    
                    {/* Kanban Board Container */}
                    <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800 mb-6">
                        <div>
                          <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <Icon name="grid" className="w-5 h-5 text-brand-600" />
                            <span>{isAdminAuthenticated ? "Kanban Pipeline (กระดานสรรหา)" : "Kanban Pipeline & Evaluation (กระดานติดตามและร่วมประเมิน)"}</span>
                          </h2>
                          <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                            {isAdminAuthenticated
                              ? "ลากย้ายขั้นตอน จัดการสถานะ และควบคุมกระบวนการสรรหาทั้งหมด"
                              : "ติดตามขั้นตอนการสรรหาทุกตำแหน่ง และคลิกปุ่ม '⭐ ร่วมประเมิน' ในด่านสัมภาษณ์ได้ทันที"}
                          </p>
                        </div>

                        <div className="relative w-full sm:w-64">
                          <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                            <Icon name="search" className="w-4 h-4" />
                          </div>
                          <input
                            type="text"
                            placeholder="ค้นหาตำแหน่ง, ฝ่าย, ผู้สมัคร..."
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            className="w-full pl-9 pr-3 py-1.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                      </div>

                      {/* Kanban Columns */}
                      <div className="flex gap-4 overflow-x-auto pb-4 snap-x min-w-full">
                        {STAGES.map(stage => {
                          const stageItems = allPositionSlots.filter(s => {
                            const matches = !searchQuery.trim() ||
                              s.jobTitle?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              s.department?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              s.candidateName?.toLowerCase().includes(searchQuery.toLowerCase());
                            return s.stage === stage.id && !s.isArchivedFromKanban && matches;
                          });

                          return (
                            <div
                              key={stage.id}
                              onDragOver={(e) => isAdminAuthenticated && handleDragOver(e, stage.id)}
                              onDragLeave={(e) => isAdminAuthenticated && handleDragLeave(e, stage.id)}
                              onDrop={(e) => isAdminAuthenticated && handleDrop(e, stage.id)}
                              className={`w-72 sm:w-80 shrink-0 snap-start flex flex-col rounded-2xl p-3 border-2 transition-all duration-150 ${
                                dragOverStage === stage.id
                                  ? 'border-brand-500 bg-brand-50/70 dark:bg-brand-950/50 ring-2 ring-brand-500/20'
                                  : 'border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40'
                              }`}
                            >
                              <div className="flex items-center justify-between pb-2 mb-3 border-b border-slate-200 dark:border-slate-700 gap-1.5">
                                <span className="text-xs font-bold text-slate-700 dark:text-slate-300 truncate">{stage.label}</span>
                                <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 shadow-2xs">
                                  {stageItems.length}
                                </span>
                              </div>

                              <div className="space-y-2.5 flex-1 overflow-y-auto max-h-[580px] pr-0.5">
                                {stageItems.map(item => {
                                  const priorityInfo = getPositionPriorityInfo(item);
                                  const isArrived = item.stage === "onboarded" && (item.hasAttendedFirstDayTraining || item.onboardingArrivalStatus === "arrived_reported");

                                  return (
                                    <div
                                      key={item.slotId}
                                      draggable={isAdminAuthenticated}
                                      onDragStart={(e) => isAdminAuthenticated && handleDragStart(e, item.slotId)}
                                      onClick={() => setSelectedDetailSlot(item)}
                                      className={`p-3.5 rounded-2xl border transition-all duration-150 cursor-pointer select-none group hover:shadow-sm shrink-0 ${
                                        item.stage === 'cancelled'
                                          ? 'border-slate-200 dark:border-slate-800 bg-rose-50/20 dark:bg-rose-950/10'
                                          : isArrived
                                          ? 'border-emerald-200 dark:border-emerald-800/60 bg-emerald-50/30 dark:bg-emerald-950/20'
                                          : 'border-slate-200/70 dark:border-slate-800 bg-white dark:bg-slate-900 hover:border-slate-300 dark:hover:border-slate-700'
                                      }`}
                                    >
                                      {/* Top Row */}
                                      <div className="flex items-center justify-between text-[11px] mb-2">
                                        <div className="flex items-center gap-1.5">
                                          {isAdminAuthenticated && (
                                            <span className="text-slate-300 dark:text-slate-600 font-mono text-xs cursor-grab" title="ลากเพื่อย้ายขั้นตอน">⋮⋮</span>
                                          )}
                                          <span className={`w-2 h-2 rounded-full ${priorityInfo.dotBg}`}></span>
                                          <span className="font-semibold text-slate-500 dark:text-slate-400 text-[11px]">
                                            {priorityInfo.label.split(' ')[0]}
                                          </span>
                                        </div>

                                        <div className="flex items-center gap-1.5">
                                          <span className="font-mono text-xs text-slate-400 dark:text-slate-500">{item.slotId}</span>
                                          {item.totalSlots > 1 && (
                                            <span className="font-extrabold text-[10px] px-2 py-0.5 rounded-lg bg-sky-100 dark:bg-sky-950 text-sky-800 dark:text-sky-300 border border-sky-300 dark:border-sky-700 shadow-2xs">
                                              {item.slotIndex}/{item.totalSlots}
                                            </span>
                                          )}
                                        </div>
                                      </div>

                                      {/* Title & Dept */}
                                      <div className="space-y-1">
                                        <h4 className="text-[13px] font-bold text-slate-900 dark:text-white break-words leading-snug">
                                          {item.jobTitle}
                                        </h4>
                                        <p className="text-[11px] text-slate-400 dark:text-slate-500 truncate">
                                          {item.department}
                                        </p>
                                      </div>

                                      {/* Candidate Name */}
                                      <div className="mt-2 text-xs">
                                        {item.candidateName ? (
                                          <span className="font-semibold text-slate-700 dark:text-slate-300 truncate block">
                                            👤 {item.candidateName}
                                          </span>
                                        ) : (
                                          <span className="text-[11px] text-slate-400 italic block">
                                            (ยังไม่ระบุผู้สมัคร)
                                          </span>
                                        )}
                                      </div>

                                      {/* Bottom Actions Row */}
                                      <div className="mt-3 pt-2.5 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between gap-1.5">
                                        <div onClick={(e) => e.stopPropagation()} className="flex items-center gap-1.5">
                                          {item.stage === "interview" && (
                                            <button
                                              type="button"
                                              onClick={(e) => {
                                                e.stopPropagation();
                                                setBlindEvalModalSlot(item);
                                              }}
                                              className="inline-flex items-center gap-1 px-2.5 py-1 rounded-xl bg-sky-600 hover:bg-sky-700 active:scale-95 text-white text-[11px] font-bold transition shadow-xs cursor-pointer shrink-0"
                                              title="คลิกเพื่อร่วมประเมินคะแนนสัมภาษณ์ผู้สมัคร"
                                            >
                                              <Icon name="clipboardCheck" className="w-3.5 h-3.5 text-white" />
                                              <span>⭐ ร่วมประเมิน</span>
                                            </button>
                                          )}

                      required

                  </div>

                    <input
                      type="time"
                      required

                  <button onClick={handleConfirmScheduleAssign} className="px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-sky-600 hover:bg-sky-700 shadow-md">ยืนยันนัดสัมภาษณ์</button>
                </div>
              </div>
            </div>
          )}

            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">

                          <div className="flex items-center justify-between">
                            <span className="font-bold text-slate-800 dark:text-slate-200">{crit.label}</span>
                            <span className="text-brand-600 font-bold">{score} / 5</span>
                          </div>
                          <div className="flex gap-2">
                            {[1, 2, 3, 4, 5].map(v => (
                              <button
                                key={v}
                                type="button"
                                onClick={() => setBlindEvalForm({ ...blindEvalForm, scores: { ...blindEvalForm.scores, [crit.id]: v } })}
                                className={`flex-1 py-1.5 rounded-lg font-bold border transition ${
                                  score === v ? "bg-brand-600 text-white border-brand-600" : "bg-white dark:bg-slate-800 text-slate-700 border-slate-200"
                                }`}
                              >
                                {v}
                              </button>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  <div className="space-y-2">
                    <div>
                      <label className="block text-[11px] font-semibold mb-1">จุดเด่นของผู้สมัคร (Strengths)</label>
                      <textarea
                        rows="2"
                        value={blindEvalForm.strengths}
                        onChange={(e) => setBlindEvalForm({ ...blindEvalForm, strengths: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                      ></textarea>
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold mb-1">ข้อเสนอแนะสรุปผล</label>
                      <select
                        value={blindEvalForm.recommendation}
                        onChange={(e) => setBlindEvalForm({ ...blindEvalForm, recommendation: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold"
                      >
                        <option value="Recommend to Hire">Recommend to Hire (เสนอรับเข้าทำงาน)</option>
                        <option value="Compare">Compare (เปรียบเทียบ)</option>
                        <option value="Not Recommended">Not Recommended (ไม่ผ่าน)</option>
                      </select>
                    </div>
                  </div>

                  <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-2">
                    <button type="button" onClick={() => setBlindEvalModalSlot(null)} className="px-4 py-2 rounded-xl bg-slate-100 text-slate-700">ยกเลิก</button>
                    <button type="submit" className="px-6 py-2 rounded-xl font-bold text-white bg-brand-600 hover:bg-brand-700 shadow-md">บันทึกผลการประเมิน</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Script Settings Modal */}
          {showSheetsModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-lg bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">⚙️</span>
                    <h3 className="text-base font-extrabold text-slate-900 dark:text-white">ตั้งค่า Script และระบบศูนย์กลาง (Central Hub)</h3>
                  </div>
                  <button onClick={() => setShowSheetsModal(false)} className="p-1 text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">
                      Google Apps Script Web App URL:
                    </label>
                    <input
                      type="url"
                      value={scriptUrlInput}
                      onChange={(e) => setScriptUrlInput(e.target.value)}
                      placeholder="https://script.google.com/macros/s/.../exec"
                      className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-mono text-[11px]"
                    />
                  </div>

                  <div className="p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-1.5">
                    <span className="font-bold text-slate-800 dark:text-slate-200 block">สถานะการเชื่อมต่อปัจจุบัน:</span>
                    <p className={`font-semibold ${syncStatus.connected ? "text-emerald-600" : "text-amber-600"}`}>
                      {syncStatus.connected ? `🟢 เชื่อมต่อกับระบบศูนย์กลางแล้ว (ซิงค์ล่าสุด: ${syncStatus.lastSynced || "เมื่อสักครู่"})` : "⏳ กำลังเชื่อมต่อ..."}
                    </p>
                  </div>

                  <div className="pt-2 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
                    <button
                      type="button"
                      onClick={() => {
                        setShowSheetsModal(false);
                        setShowResetConfirmModal(true);
                      }}
                      className="px-3.5 py-2 rounded-xl text-xs font-bold text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200 transition"
                    >
                      🧹 ล้างข้อมูลทดสอบในระบบกลาง
                    </button>

                    <div className="flex gap-2">
                      <button
                        onClick={() => {
                          setScriptUrlInput(DEFAULT_APPS_SCRIPT_WEBAPP_URL);
                          setGoogleScriptUrl(DEFAULT_APPS_SCRIPT_WEBAPP_URL);
                          localStorage.setItem("hr_central_script_url_v7", DEFAULT_APPS_SCRIPT_WEBAPP_URL);
                          triggerToast("รีเซ็ตเป็น URL เริ่มต้นแล้ว");
                        }}
                        className="px-3 py-2 rounded-xl text-slate-600 bg-slate-100 text-xs font-bold hover:bg-slate-200"
                      >
                        ค่าเริ่มต้น
                      </button>
                      <button
                        onClick={() => {
                          setGoogleScriptUrl(scriptUrlInput.trim());
                          localStorage.setItem("hr_central_script_url_v7", scriptUrlInput.trim());
                          setShowSheetsModal(false);
                          syncWorkflowStatus(false);
                          triggerToast("บันทึก URL ใหม่เรียบร้อยแล้ว");
                        }}
                        className="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow-md"
                      >
                        บันทึก URL
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Reset Central Data Confirmation Modal */}
          {showResetConfirmModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-amber-300 dark:border-amber-700 p-6 space-y-4">
                <div className="flex items-center gap-3 pb-3 border-b border-slate-200 dark:border-slate-800">
                  <div className="w-11 h-11 rounded-2xl bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300 flex items-center justify-center text-xl shrink-0">
                    🧹
                  </div>
                  <div>
                    <h3 className="text-base font-extrabold text-slate-900 dark:text-white">ยืนยันรีเซ็ตระบบศูนย์กลาง</h3>
                    <p className="text-xs text-slate-400">Clean & Reset Central Hub Database</p>
                  </div>
                </div>

                <div className="p-3.5 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 text-xs text-amber-900 dark:text-amber-200 space-y-1.5 leading-relaxed">
                  <p className="font-bold">⚠️ สิ่งที่จะเกิดขึ้นเมื่อกดยืนยัน:</p>
                  <ul className="list-disc pl-4 space-y-1 text-[11.5px]">
                    <li>ล้างตำแหน่งที่เคยลากย้ายทดสอบในระบบส่วนกลางออกทั้งหมด</li>
                    <li>ล้างคะแนนประเมินสัมภาษณ์ที่เคยทดสอบไว้</li>
                    <li>ดึงข้อมูล Requisitions และ Candidates ดิบเริ่มต้นจาก Google Sheets ใหม่</li>
                    <li>ทุกหน้าต่าง (ทั้ง Admin และ User) จะรีเซ็ตกลับมาที่จุดเริ่มต้นพร้อมกัน</li>
                  </ul>
                </div>

                <div className="pt-2 flex justify-end gap-2 border-t border-slate-200 dark:border-slate-800">
                  <button
                    disabled={isResettingData}
                    onClick={() => setShowResetConfirmModal(false)}
                    className="px-4 py-2.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300"
                  >
                    ยกเลิก
                  </button>
                  <button
                    disabled={isResettingData}
                    onClick={handleResetCentralData}
                    className="px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-amber-600 hover:bg-amber-700 shadow-md flex items-center gap-1.5 disabled:opacity-50"
                  >
                    {isResettingData ? "กำลังรีเซ็ต..." : "ยืนยันล้างข้อมูล & ซิงค์ใหม่"}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-2xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-2xl text-xs font-semibold flex items-center gap-2 animate-bounce">
              <Icon name="checkCircle" className="w-4 h-4 text-emerald-400" />
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
