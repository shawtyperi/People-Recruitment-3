                  {departmentModalSlots.length === 0 ? (
                    <div className="p-8 text-center text-slate-400 italic bg-slate-50 dark:bg-slate-800/40 rounded-2xl">
                      ไม่มีตำแหน่งงานในฝ่ายนี้
                    </div>
                  ) : (
                    departmentModalSlots.map(s => {
                      const sla = getSLAInfo(s.requestDate, s.stage, s.offerSentDate);
                      return (
                        <div key={s.slotId} className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                          <div>
                            <div className="flex items-center gap-2 text-[10px] mb-1">
                              <span className="font-bold text-brand-600">{s.slotId}</span>
                              <span className="text-slate-400">&bull;</span>
                              <span className="text-slate-500 font-semibold">{s.positionType}</span>
                              <span className="text-slate-400">&bull;</span>
                              <span className={`px-2 py-0.5 rounded font-bold ${s.slotStatus === "Closed" ? "bg-emerald-100 text-emerald-800" : "bg-amber-100 text-amber-800"}`}>
                                {s.slotStatus}
                              </span>
                            </div>
                            <h4 className="font-bold text-sm text-slate-900 dark:text-white">{s.jobTitle}</h4>
                            {s.candidateName && (
                              <p className="text-emerald-700 dark:text-emerald-300 font-semibold text-xs mt-1">
                                👤 แคนดิเดต: {s.candidateName} {s.candidateNickname ? `(${s.candidateNickname})` : ''}
                              </p>
                            )}
                            {currentView === "admin" && (
                              <div className="mt-2 text-[10px] text-slate-400 space-y-0.5">
                                <p>ผู้ขอ: {s.requesterName} &bull; ผู้อนุมัติ: {s.approverName}</p>
                                {s.hireDate && <p className="text-emerald-600 font-bold">🎉 วันเริ่มงาน: {s.hireDate}</p>}
                                {s.evaluationsCount > 0 && (
                                  <p className="text-brand-600 font-semibold">⭐ ผลประเมิน: {s.interviewScore}/5 ({s.interviewScorePercent}%) - {s.evaluationsCount} ท่าน</p>
                                )}
                              </div>
                            )}
                          </div>

                          <div className="flex sm:flex-col items-end gap-1.5 shrink-0">
                            <span className="px-2.5 py-1 rounded-xl bg-slate-200 dark:bg-slate-700 font-bold text-[11px]">
                              Stage: {s.stage}
                            </span>
                            <span className="text-[10px] text-slate-500">
                              ⏱️ {sla.workingDaysElapsed} วันทำการ
                            </span>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>

                <div className="pt-3 pb-4 px-6 border-t border-slate-200 dark:border-slate-800 flex justify-end">
                  <button
                    onClick={() => setSelectedDepartmentDetail(null)}
                    className="px-5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200"
                  >
                    ปิดหน้าต่าง
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* Blind Evaluation Modal Form */}
          {blindEvalModalSlot && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-2xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden max-h-[94vh] flex flex-col">
                
                <div className="px-6 py-4 bg-gradient-to-r from-brand-600 to-sky-600 text-white flex items-center justify-between">
                  <div>
                    <span className="text-[10px] font-extrabold uppercase tracking-wider text-sky-200">
                      แบบฟอร์มประเมินสัมภาษณ์งาน (INTERVIEW EVALUATION FORM)
                    </span>
                    <h3 className="text-base sm:text-lg font-extrabold mt-0.5">
                      {blindEvalModalSlot.candidateName || "ผู้สมัคร"} &bull; {blindEvalModalSlot.jobTitle}
                    </h3>
                  </div>
                  <button onClick={() => setBlindEvalModalSlot(null)} className="p-2 text-white/80 hover:text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="bg-sky-50 dark:bg-sky-950/70 border-b border-sky-200/80 dark:border-sky-800 px-6 py-2.5 flex items-center gap-2 text-xs text-sky-800 dark:text-sky-200 font-medium">
                  <Icon name="shieldCheck" className="w-4 h-4 text-sky-600 shrink-0" />
                  <span>
                    <strong>การประเมินแบบอิสระ (Blind Assessment):</strong> แบบฟอร์มนี้จะไม่แสดงคะแนนหรือความคิดเห็นของกรรมการท่านอื่น เพื่อความเป็นกลาง
                  </span>
                </div>

                <form onSubmit={handleSaveBlindEvaluation} className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
                  
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        ชื่อผู้ประเมิน <span className="text-rose-600">*</span>
                      </label>
                      <SearchableSelect
                        value={blindEvalForm.evaluatorName}
                        placeholder="-- เลือกหรือพิมพ์ชื่อผู้ประเมิน --"
                        options={evaluatorOptions}
                        onChange={(name) => setBlindEvalForm({ ...blindEvalForm, evaluatorName: name })}
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        บทบาท (Role) <span className="text-rose-600">*</span>
                      </label>
                      <select
                        value={blindEvalForm.evaluatorRole}
                        onChange={(e) => setBlindEvalForm({ ...blindEvalForm, evaluatorRole: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                      >
                        {EVALUATOR_ROLES.map(role => (
                          <option key={role} value={role}>{role}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        วันที่ประเมิน <span className="text-rose-600">*</span>
                      </label>
                      <input
                        type="date"
                        required
                        value={blindEvalForm.date}
                        onChange={(e) => setBlindEvalForm({ ...blindEvalForm, date: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                      />
                    </div>
                  </div>

                  <div className="space-y-3">
                    <div className="font-bold text-slate-900 dark:text-white text-xs pb-1 border-b border-slate-200 dark:border-slate-800">
                      เกณฑ์การประเมิน 5 ด้าน (1 = ต่ำกว่ามาตรฐานมาก, 5 = เหนือกว่ามาตรฐานมาก)
                    </div>

                    {EVALUATION_CRITERIA.map(crit => {
                      const score = blindEvalForm.scores[crit.id];

                      return (
                        <div key={crit.id} className="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-700/80 space-y-2">
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-1">
                            <div>
                              <h4 className="font-bold text-slate-900 dark:text-white text-xs">{crit.label}</h4>
                              <p className="text-[11px] text-slate-500 dark:text-slate-400">{crit.desc}</p>
                            </div>
                            <span className="text-brand-600 dark:text-brand-400 font-extrabold text-xs shrink-0">
                              คะแนน: {score} / 5
                            </span>
                          </div>

                          <div className="flex items-center gap-1.5 pt-1 border-t border-slate-200/50 dark:border-slate-700/50">
                            {[1, 2, 3, 4, 5].map(val => (
                              <button
                                key={`score-${crit.id}-${val}`}
                                type="button"
                                onClick={() => setBlindEvalForm({
                                  ...blindEvalForm,
                                  scores: { ...blindEvalForm.scores, [crit.id]: val }
                                })}
                                className={`flex-1 py-1.5 rounded-xl font-bold text-xs transition border ${
                                  score === val
                                    ? "bg-brand-600 text-white border-brand-600 shadow-sm"
                                    : "bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:bg-slate-100"
                                }`}
                              >
                                {val}
                              </button>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {(() => {
                    const sc = blindEvalForm.scores;
                    const tot = Number(sc.c1) + Number(sc.c2) + Number(sc.c3) + Number(sc.c4) + Number(sc.c5);
                    const avg = (tot / 5).toFixed(1);
                    const pct = Math.round((tot / 25) * 100);
                    const isPass = pct >= 70;

                    return (
                      <div className={`p-3.5 rounded-2xl border flex items-center justify-between ${
                        isPass 
                          ? "bg-emerald-50 dark:bg-emerald-950/40 border-emerald-300 dark:border-emerald-800 text-emerald-900 dark:text-emerald-200"
                          : "bg-amber-50 dark:bg-amber-950/40 border-amber-300 dark:border-amber-800 text-amber-900 dark:text-amber-200"
                      }`}>
                        <div>
                          <p className="text-[10px] uppercase font-bold opacity-80">สรุปคะแนนประเมินของคุณ</p>
                          <h4 className="text-base font-extrabold mt-0.5">{tot} / 25 คะแนน (เฉลี่ย {avg}/5 &bull; {pct}%)</h4>
                        </div>
                        <span className={`px-2.5 py-1 rounded-lg font-bold text-xs ${
                          isPass ? "bg-emerald-600 text-white" : "bg-amber-600 text-white"
                        }`}>
                          {isPass ? "เกณฑ์ผ่าน (≥ 70%)" : "ต่ำกว่า 70%"}
                        </span>
                      </div>
                    );
                  })()}

                  <div className="space-y-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        จุดเด่นของผู้สมัคร (Strengths) <span className="text-rose-600">*</span>
                      </label>
                      <textarea
                        required
                        rows="2"
                        placeholder="ระบุจุดเด่น ทักษะ หรือประสบการณ์สำคัญ..."
                        value={blindEvalForm.strengths}
                        onChange={(e) => setBlindEvalForm({ ...blindEvalForm, strengths: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                      ></textarea>
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        ข้อควรพัฒนา (Areas for Improvement) <span className="text-rose-600">*</span>
                      </label>
                      <textarea
                        required
                        rows="2"
                        placeholder="ระบุข้อควรพัฒนาเพิ่มเติม..."
                        value={blindEvalForm.improvements}
                        onChange={(e) => setBlindEvalForm({ ...blindEvalForm, improvements: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                      ></textarea>
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        ข้อเสนอแนะสรุปผล (Recommendation) <span className="text-rose-600">*</span>
                      </label>
                      <select
                        required
                        value={blindEvalForm.recommendation}
                        onChange={(e) => setBlindEvalForm({ ...blindEvalForm, recommendation: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold"
                      >
                        <option value="Recommend to Hire">Recommend to Hire (เสนอรับเข้าทำงาน)</option>
                        <option value="Compare">Compare (เปรียบเทียบกับผู้สมัครรายอื่น)</option>
                        <option value="Keep in Pool / Reserve">Keep in Pool / Reserve (เก็บเป็นตัวสำรอง)</option>
                        <option value="Not Recommended">Not Recommended (ไม่ผ่านการคัดเลือก)</option>
                      </select>
                    </div>
                  </div>

                  <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setBlindEvalModalSlot(null)}
                      className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200"
                    >
                      ยกเลิก
                    </button>
                    <button
                      type="submit"
                      className="px-6 py-2 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-brand-600 to-sky-500 hover:from-brand-700 hover:to-sky-600 shadow-md"
                    >
                      บันทึกผลการประเมิน
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* Admin Audit Modal */}
          {adminAuditSlot && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-3xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden max-h-[92vh] flex flex-col">
                
                <div className="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
                  <div>
                    <span className="text-[10px] font-extrabold uppercase tracking-wider text-emerald-400">
                      ADMIN &amp; HR AUDIT REPORT: DETAILED EVALUATION BREAKDOWN
                    </span>
                    <h3 className="text-base sm:text-lg font-bold mt-0.5">
                      {adminAuditSlot.candidateName || "ผู้สมัคร"} &bull; {adminAuditSlot.jobTitle} (Slot #{adminAuditSlot.slotId})
                    </h3>
                  </div>
                  <button onClick={() => setAdminAuditSlot(null)} className="p-2 text-white/80 hover:text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
                  
                  {(() => {
                    const stats = calculateOverallScore(adminAuditSlot.evaluations);
                    const isPass = stats.result === "Pass";

                    return (
                      <div className={`p-4 rounded-2xl border flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${
                        isPass 
                          ? "bg-emerald-50 dark:bg-emerald-950/50 border-emerald-300 dark:border-emerald-800 text-emerald-900 dark:text-emerald-200"
                          : "bg-rose-50 dark:bg-rose-950/50 border-rose-300 dark:border-rose-800 text-rose-900 dark:text-rose-200"
                      }`}>
                        <div>
                          <span className="text-[10px] uppercase font-extrabold opacity-80">
                            คะแนนเฉลี่ยรวมจากกรรมการทั้งหมด ({stats.count} ท่าน)
                          </span>
                          <h4 className="text-2xl font-extrabold mt-0.5">
                            {stats.combinedAvg} / 5 ({stats.combinedPct}%)
                          </h4>
                          <p className="text-[11px] opacity-80 mt-0.5">
                            เกณฑ์การคัดเลือก: ผ่านที่ 70% ขึ้นไป (คะแนนเฉลี่ย 3.5 / 5.0)
                          </p>
                        </div>
                        <div className="flex items-center gap-2 shrink-0">
                          <span className={`px-3 py-1.5 rounded-xl font-extrabold text-xs uppercase shadow-xs ${
                            isPass ? "bg-emerald-600 text-white" : "bg-rose-600 text-white"
                          }`}>
                            {isPass ? "✓ ผ่านการประเมิน (Pass)" : "✗ ไม่ผ่านการประเมิน (Fail)"}
                          </span>
                        </div>
                      </div>
                    );
                  })()}

                  <div className="space-y-3">
                    <div className="font-bold text-slate-900 dark:text-white text-xs pb-1 border-b border-slate-200 dark:border-slate-800">
                      รายละเอียดคะแนนแยกรายบุคคล (Individual Submissions)
                    </div>

                    {(adminAuditSlot.evaluations || []).length === 0 ? (
                      <div className="p-8 text-center text-slate-400 italic bg-slate-50 dark:bg-slate-800/40 rounded-2xl">
                        ยังไม่มีกรรมการหรือ HR บันทึกผลประเมินสำหรับตำแหน่งนี้
                      </div>
                    ) : (
                      adminAuditSlot.evaluations.map((ev, idx) => (
                        <div key={ev.id || idx} className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 space-y-3">
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-1 pb-2 border-b border-slate-200/60 dark:border-slate-700/60">
                            <div>
                              <div className="font-extrabold text-slate-900 dark:text-white text-sm flex items-center gap-2">
                                <span>#{idx + 1} {ev.evaluatorName}</span>
                                <span className="px-2 py-0.5 rounded-md bg-brand-50 dark:bg-brand-950 text-brand-600 dark:text-brand-400 text-[10px] font-semibold">
                                  {ev.evaluatorRole}
                                </span>
                              </div>
                              <p className="text-[10px] text-slate-400 mt-0.5">วันที่ประเมิน: {ev.date}</p>
                            </div>
                            <div className="text-right">
                              <span className="text-base font-extrabold text-slate-900 dark:text-white">{ev.avg} / 5</span>
                              <span className="text-[10px] text-slate-400 ml-1">({ev.pct}%)</span>
                            </div>
                          </div>

                          <div className="grid grid-cols-5 gap-1.5 text-center text-[10px]">
                            {EVALUATION_CRITERIA.map(crit => (
                              <div key={crit.id} className="p-1.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-200/60 dark:border-slate-700">
                                <span className="block text-slate-400 truncate" title={crit.label}>ข้อ {crit.id.replace('c','')}</span>
                                <strong className="text-xs font-bold text-brand-600">{ev.scores?.[crit.id] || '-'}/5</strong>
                              </div>
                            ))}
                          </div>

                          <div className="space-y-1 text-[11px] text-slate-600 dark:text-slate-300 pt-1">
                            {ev.strengths && <p><strong>จุดเด่น:</strong> {ev.strengths}</p>}
                            {ev.improvements && <p><strong>ข้อควรพัฒนา:</strong> {ev.improvements}</p>}
                            <p><strong>ข้อเสนอแนะ:</strong> <span className="font-semibold text-brand-600 dark:text-brand-400">{ev.recommendation || '-'}</span></p>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                </div>

                <div className="pt-3 pb-4 px-6 border-t border-slate-200 dark:border-slate-800 flex justify-end">
                  <button
                    onClick={() => setAdminAuditSlot(null)}
                    className="px-5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200"
                  >
                    ปิดหน้าต่าง Audit
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* Add Candidate Modal */}
          {showAddCandidateModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-2xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden max-h-[92vh] flex flex-col">
                
                {/* Header */}
                <div className="px-6 py-4 bg-gradient-to-r from-brand-600 to-sky-600 text-white flex items-center justify-between">
                  <div>
                    <span className="text-[10px] font-extrabold uppercase tracking-wider text-sky-200 block">
                      CANDIDATE POOL ENROLLMENT (ระบบบันทึกผู้สมัครงาน)
                    </span>
                    <h3 className="text-base sm:text-lg font-extrabold flex items-center gap-2 mt-0.5">
                      <Icon name="plus" className="w-5 h-5 text-white" />
                      <span>Add New Candidate to Candidate Pool (เพิ่มผู้สมัครใหม่เข้า Candidate Pool)</span>
                    </h3>
                  </div>
                  <button onClick={() => setShowAddCandidateModal(false)} className="p-2 text-white/80 hover:text-white rounded-xl hover:bg-white/10 transition">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                {/* Mandatory Policy Banner */}
                <div className="p-3.5 bg-amber-50 dark:bg-amber-950/40 border-b border-amber-200 dark:border-amber-800 text-[11.5px] text-amber-900 dark:text-amber-200 font-semibold flex items-center gap-2">
                  <span className="text-base">🔒</span>
                  <span><strong>Mandatory Completion Policy (นโยบายการกรอกข้อมูล):</strong> จำเป็นต้องระบุข้อมูลให้ครบทุกช่องที่มีเครื่องหมาย <span className="text-rose-600 font-bold">*</span> หากไม่ครบ ระบบจะไม่สามารถบันทึกได้</span>
                </div>

                <form onSubmit={handleSaveNewCandidate} className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
                  {/* Row 1: Full Name & Nickname */}
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div className="sm:col-span-2">
                      <label className="block text-[11px] font-bold mb-1 text-slate-700 dark:text-slate-300">
                        Full Name (ชื่อ - นามสกุล) <span className="text-rose-600 font-bold">*</span>
                      </label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. นาย สิทธิชัย อัศวเดช / John Smith"

                    <div className="flex items-center gap-2">
                      <span className="text-[10px] font-extrabold uppercase tracking-wider text-amber-400">

                    </span>
                    <span>&rarr;</span>
                    <span className={(selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) === "PENDING_APPROVER" ? "text-sky-600 font-extrabold" : (selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) === "PENDING_IT" || (selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) === "READY_FOR_RECRUITMENT" ? "text-emerald-600" : ""}>

                    </span>
                    <span>&rarr;</span>
                    <span className={(selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) === "PENDING_IT" ? "text-purple-600 font-extrabold" : (selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) === "READY_FOR_RECRUITMENT" ? "text-emerald-600" : ""}>

                    </span>
                    <span>&rarr;</span>
                    <span className={(selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) === "READY_FOR_RECRUITMENT" || selectedRequisitionDetail.requestStatus === "Recruiting" ? "text-emerald-600 font-extrabold" : ""}>

                    </span>

                          return (
                            <span className={`inline-block px-3 py-1 rounded-xl font-extrabold border ${cfg.badge}`}>

                        <span className="text-slate-400 block text-[10px]">ฝ่ายงาน:</span>

                      <div>

                        <span className="text-slate-400 block text-[10px]">วุฒิการศึกษา:</span>

                      <div>
                        <span className="text-slate-400 block text-[10px]">สาขาวิชา:</span>

                      <div>
                        <span className="text-slate-400 block text-[10px]">ประสบการณ์:</span>

                      </div>

                    </h4>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-[10.5px]">
                      <div className="p-2 rounded-xl bg-white dark:bg-slate-800 border border-purple-200 dark:border-purple-800">
                        <span className="text-slate-400 block text-[10px]">Laptop/PC:</span>
                        <strong className="text-brand-600 font-bold">{selectedRequisitionDetail.itLaptop || "ต้องการ"}</strong>

                      <div className="p-2 rounded-xl bg-white dark:bg-slate-800 border border-purple-200 dark:border-purple-800">
                        <span className="text-slate-400 block text-[10px]">Sim Card:</span>

                      <div className="p-2 rounded-xl bg-white dark:bg-slate-800 border border-purple-200 dark:border-purple-800">
                        <span className="text-slate-400 block text-[10px]">Email องค์กร:</span>
                        <strong className="text-brand-600 font-bold">{selectedRequisitionDetail.itEmail || "ต้องการ"}</strong>

                      <div className="p-2 rounded-xl bg-white dark:bg-slate-800 border border-purple-200 dark:border-purple-800">
                        <span className="text-slate-400 block text-[10px]">ERP Netsuite:</span>
                        <strong className="text-brand-600 font-bold">{selectedRequisitionDetail.itNetsuite || "ไม่ต้องการ"}</strong>

                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200 hover:bg-slate-100 transition"

                  </button>

                        onClick={() => {
                          setRejectionNoteInput(selectedRequisitionDetail.rejectionReason || "");
                          setShowRejectModal(true);
                        }}
                        className="px-4 py-2 rounded-xl text-xs font-bold text-rose-600 dark:text-rose-400 bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 transition active:scale-95"
                      >
                        ❌ ปฏิเสธ/ตีกลับ (Reject)

                    {(selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) === "PENDING_ADMIN" && (
                      <button

                        disabled={isApprovingEmailSending}
                        onClick={() => handleAdminApproveAndMoveToManpower(selectedRequisitionDetail)}
                        className="px-5 py-2 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 shadow-md shadow-emerald-500/20 transition active:scale-95 disabled:opacity-50 flex items-center gap-1.5"

                      </button>
                    )}
                  </div>
                </div>
              </div>
            </div>

          {showRejectModal && selectedRequisitionDetail && (
            <div className="fixed inset-0 z-[90] flex items-center justify-center p-3 sm:p-4 bg-slate-950/75 backdrop-blur-md animate-fadeIn">

                <div className="flex items-start justify-between pb-3 border-b border-slate-200 dark:border-slate-800">

                    onChange={(e) => setRejectionNoteInput(e.target.value)}

                <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => setShowRejectModal(false)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200"
                  >

                  </button>

                    type="button"
                    onClick={() => handleAdminRejectRequisition(selectedRequisitionDetail.id)}

                          <span className="font-bold text-xs text-purple-900 dark:text-purple-200 flex items-center gap-1.5">

                          </span>

                            <span className="px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800 dark:bg-emerald-900/60 dark:text-emerald-200 font-bold text-[10px] flex items-center gap-1">
                              <span>✓ ส่งอีเมลแล้ว</span>
                            </span>

                            <span className="text-[10px] text-amber-600 dark:text-amber-400 font-semibold">

                          <p><strong>Position :</strong> {selectedDetailSlot.jobTitle || "-"}</p>
                          <p><strong>Department:</strong> {selectedDetailSlot.department || "-"}</p>
                          <p><strong>Division (SSC):</strong> {selectedDetailSlot.division || selectedDetailSlot.department || "-"}</p>
                          <p><strong>Hire date:</strong> <span className="text-rose-600 dark:text-rose-400 font-bold">{selectedDetailSlot.hireDate || "ยังไม่ระบุวันเริ่มงาน"}</span></p>

                          onClick={() => handleSendITNotification(selectedDetailSlot)}

                          <Icon name="send" className="w-3.5 h-3.5 text-white" />
                          <span>{selectedDetailSlot.isItNotified ? "ส่งอีเมลแจ้งทีม IT ซ้ำอีกครั้ง" : "ส่ง Email ข้อมูลไปให้ทางทีม IT (people@valuesourcing.co)"}</span>
                        </button>
                      </div>

                      {/* ขั้นที่ 3: เมื่อ IT กดรับทราบ -> ให้ขึ้นเป็นสีเขียวเด่นชัด */}

                        selectedDetailSlot.itEquipmentConfirmed
                          ? "bg-emerald-50 dark:bg-emerald-950/60 border-emerald-300 dark:border-emerald-700 shadow-sm"
                          : "bg-white dark:bg-slate-800/80 border-slate-200 dark:border-slate-700 shadow-2xs"

                          <div className="space-y-0.5">
                            <span className={`font-bold text-xs flex items-center gap-1.5 ${
                              selectedDetailSlot.itEquipmentConfirmed
                                ? "text-emerald-900 dark:text-emerald-200"
                                : "text-slate-800 dark:text-slate-200"
                            }`}>
                              <span className={`w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center ${
                                selectedDetailSlot.itEquipmentConfirmed
                                  ? "bg-emerald-600 text-white"
                                  : "bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300"
                              }`}>3</span>

                                : "รอทีม IT กดปุ่มยืนยันรับทราบในอีเมล (หรือแอดมินคลิกยืนยันแทนได้)"}
                            </p>
                          </div>

                          <div className="shrink-0 pl-6 sm:pl-0">
                            {selectedDetailSlot.itEquipmentConfirmed ? (
                              <div className="flex items-center gap-2">

                                </span>

                                  type="button"
                                  onClick={() => handleToggleITEquipmentConfirmed(selectedDetailSlot.slotId)}
                                  className="text-[10px] text-slate-400 hover:text-slate-600 underline"
                                  title="คลิกหากต้องการยกเลิก"
                                >
                                  แก้ไข
                                </button>
                              </div>
                            ) : (
                              <button
                                type="button"
                                onClick={() => handleToggleITEquipmentConfirmed(selectedDetailSlot.slotId)}
                                className="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-700 dark:bg-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-600 text-xs font-bold transition active:scale-95"

                                ⏳ คลิกยืนยันแทน IT: อุปกรณ์พร้อมแล้ว
                              </button>

                          </div>
                        </div>

                        selectedDetailSlot.hasAttendedFirstDayTraining || selectedDetailSlot.onboardingArrivalStatus === "arrived_reported"

                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
                          <div className="space-y-0.5">
                            <span className={`font-bold text-xs flex items-center gap-1.5 ${
                              selectedDetailSlot.hasAttendedFirstDayTraining || selectedDetailSlot.onboardingArrivalStatus === "arrived_reported"
                                ? "text-emerald-900 dark:text-emerald-200"
                                : "text-slate-800 dark:text-slate-200"
                            }`}>
                              <span className={`w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center ${
                                selectedDetailSlot.hasAttendedFirstDayTraining || selectedDetailSlot.onboardingArrivalStatus === "arrived_reported"

                                  : "bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300"

                                  <span>✅ มาเริ่มงานแล้ว &amp; ปิดการสรรหา (Closed)</span>
                                </span>
                              </div>
                            )}
                          </div>
                        </div>
                      </div>
                    </div>

                  {(selectedDetailSlot.slotStatus === "Closed" || selectedDetailSlot.stage === "cancelled") && (

                        : selectedDetailSlot.onboardingArrivalStatus === "arrived_reported"
                        ? "bg-emerald-50 dark:bg-emerald-950/50 border-emerald-400 ring-2 ring-emerald-500/20"

                        <div>
                          <span className="text-[10px] font-extrabold uppercase text-slate-400">

                          </span>
                          {selectedDetailSlot.hireDate && selectedDetailSlot.stage !== "cancelled" && (
                            <p className="text-xs font-bold text-emerald-700 dark:text-emerald-300 mt-0.5">

                          {(selectedDetailSlot.stage === "cancelled" || selectedDetailSlot.onboardingArrivalStatus === "declined_noshow") && (
                            <p className="text-xs font-bold text-rose-600 dark:text-rose-400 mt-0.5">

                            </p>

                        <div className="flex items-center gap-1">
                          <select

                            className={`text-xs font-extrabold px-3 py-1.5 rounded-xl border transition ${
                              selectedDetailSlot.onboardingArrivalStatus === "declined_noshow"
                                ? "bg-rose-600 text-white border-rose-700 shadow-sm ring-2 ring-rose-500/20 cursor-not-allowed opacity-95"
                                : selectedDetailSlot.onboardingArrivalStatus === "arrived_reported"
                                ? "bg-emerald-600 text-white border-emerald-700"
                                : "bg-amber-100 text-amber-900 border-amber-300"
                            }`}

                              <option key={arr.id} value={arr.id}>{arr.label}</option>
                            ))}
                          </select>
                          {selectedDetailSlot.onboardingArrivalStatus === "declined_noshow" && (
                            <span className="text-xs text-rose-600 font-bold" title="สถานะถูกล็อกแล้ว">🔒</span>
                          )}
                        </div>
                      </div>

                      {selectedDetailSlot.onboardingArrivalStatus === "arrived_reported" && selectedDetailSlot.stage !== "cancelled" && (
                        <div className="mt-2 text-[11px] font-bold text-emerald-700 dark:text-emerald-300 flex items-center gap-1.5">
                          <Icon name="badgeCheck" className="w-4 h-4 text-emerald-600" />
                          <span>ตำแหน่งนี้ปิดงานสมบูรณ์ 100% (พนักงานมารายงานตัวเรียบร้อยแล้ว)</span>
                        </div>
                      )}

                      {(selectedDetailSlot.stage === "cancelled" || selectedDetailSlot.onboardingArrivalStatus === "declined_noshow") && (
                        <div className="mt-2 text-[11px] font-bold text-rose-700 dark:text-rose-300 flex items-center gap-1.5">
                          <Icon name="exclamation" className="w-4 h-4 text-rose-600" />
                          <span>สละสิทธิ์ / ไม่มาเริ่มงาน (ตำแหน่งถูกปิดเป็น Rejected/Cancelled พร้อมล็อกสถานะ)</span>

                      )}
                    </div>
                  )}

                  {selectedDetailSlot.candidateName ? (
                    <div className="p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800 space-y-2">

                        <p className="font-bold text-emerald-900 dark:text-emerald-200 text-sm">👤 แคนดิเดต: {selectedDetailSlot.candidateName}</p>

                          <button
                            onClick={() => {
                              const slot = selectedDetailSlot;
                              setSelectedDetailSlot(null);
                              setUnassignConfirmTarget(slot);

                            className="text-[10px] font-bold text-rose-600 hover:underline"

                          </button>
                        )}

                      <p className="text-emerald-700 dark:text-emerald-300">📞 {selectedDetailSlot.candidatePhone || "-"}</p>

                          <div className="mt-1 space-y-1.5">
                            <div className="flex flex-wrap items-center justify-between gap-1.5">
                              <p className="text-amber-800 dark:text-amber-300 font-semibold">📅 วันเวลานัดสัมภาษณ์: {selectedDetailSlot.interviewSchedule}</p>

                                <span className={`inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] border ${relTime.badge}`}>

                                    <span className="relative flex h-2 w-2">
                                      <span className={`animate-ping absolute inline-flex h-full w-full rounded-full ${relTime.dotBg} opacity-75`}></span>

                                    </span>

                                  <span>{relTime.text}</span>
                                </span>

                                  <Icon name="link" className="w-3.5 h-3.5 text-white" />
                                  <span>เปิดเข้าห้องประชุม Google Meet ทันที &rarr;</span>
                                </a>
                              </div>
                            )}
                          </div>

                      })()}

                            <span className="font-bold text-slate-800 dark:text-slate-200">ผลประเมินสัมภาษณ์เฉลี่ยรวม ({selectedDetailSlot.evaluationsCount} ท่าน):</span>
                            <span className={`px-2 py-0.5 rounded font-extrabold text-[10px] ${
                              selectedDetailSlot.interviewResult === "Pass" ? "bg-emerald-600 text-white" : "bg-rose-600 text-white"
                            }`}>
                              {selectedDetailSlot.interviewResult} ({selectedDetailSlot.interviewScore}/5 - {selectedDetailSlot.interviewScorePercent}%)
                            </span>
                          </div>
                          {isAdminAuthenticated && (
                            <button
                              onClick={() => {
                                const s = selectedDetailSlot;
                                setSelectedDetailSlot(null);
                                setAdminAuditSlot(s);
                              }}
                              className="text-xs font-bold text-brand-600 hover:underline mt-1"
                            >
                              🔍 เปิดดู Audit Breakdown รายชื่อและคะแนนกรรมการทุกคน &rarr;
                            </button>
                          )}
                        </div>
                      )}

                      {/* Add Interview Evaluation Button in Slot Detail Modal (Strictly ONLY in Interview Stage) */}
                      {selectedDetailSlot.stage === "interview" && (
                        <div className="mt-3 pt-2.5 border-t border-emerald-200/70 dark:border-emerald-800/70 flex items-center justify-between">
                          <button
                            type="button"
                            onClick={() => handleOpenBlindEvaluationModal(selectedDetailSlot)}
                            className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-brand-600 hover:bg-brand-700 active:scale-95 text-white font-bold text-xs shadow-xs transition cursor-pointer"

                            <span>+ บันทึกผลประเมินสัมภาษณ์</span>
                          </button>
                          <span className="text-[11px] text-slate-500 dark:text-slate-400">
                            {selectedDetailSlot.evaluationsCount > 0 ? `ประเมินแล้ว ${selectedDetailSlot.evaluationsCount} ท่าน` : "ยังไม่มีผู้ประเมิน"}
                          </span>
                        </div>
                      )}
                    </div>
                  ) : (

                        type="button"
                        onClick={() => {
                          const slot = selectedDetailSlot;
                          setSelectedDetailSlot(null);
                          setUnassignedInterviewSlotModal(slot);
                        }}
                        className="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow-xs transition inline-flex items-center gap-1.5"
                      >
                        <span>👤 + เลือก Candidate สำหรับตำแหน่งนี้</span>
                      </button>
                    </div>
                  )}
                </div>

                <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end">
                  <button onClick={() => setSelectedDetailSlot(null)} className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200">
                    ปิด
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Unassign Confirmation Modal */}
          {unassignConfirmTarget && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fadeIn">

                <p className="text-xs text-slate-500 mb-4">
                  คุณต้องการถอดคุณ <strong>{unassignConfirmTarget.candidateName}</strong> ออกจากตำแหน่ง Slot #{unassignConfirmTarget.slotId} ใช่หรือไม่?
                </p>
                <div className="flex gap-2 justify-center">
                  <button
                    onClick={() => setUnassignConfirmTarget(null)}
                    className="px-4 py-2 rounded-xl text-xs bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300"
                  >
                    ยกเลิก
                  </button>
                  <button
                    onClick={() => handleUnassignCandidate(unassignConfirmTarget.slotId, unassignConfirmTarget.candidateName)}
                    className="px-5 py-2 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-700"
                  >
                    ยืนยันถอดออก
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Delete Candidate Confirmation Modal */}
          {candidateToDelete && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">

                  {candidateToDelete.assignedSlotId && (
                    <p className="text-[11px] text-amber-700 dark:text-amber-300 font-semibold bg-amber-50 dark:bg-amber-950/40 p-2 rounded-xl mt-2">
                      ⚠️ ผู้สมัครนี้กำลังผูกอยู่กับ Slot #{candidateToDelete.assignedSlotId} ระบบจะปลดการผูกตำแหน่งออกให้อัตโนมัติ
                    </p>
                  )}
                </div>

                <div className="flex gap-2 justify-center pt-2">
                  <button
                    type="button"
                    onClick={() => setCandidateToDelete(null)}
                    className="w-1/2 py-2.5 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300 transition"
                  >
                    ยกเลิก
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmDeleteCandidate}
                    className="w-1/2 py-2.5 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 shadow-md shadow-rose-600/30 transition active:scale-95"
                  >
                    ยืนยันการลบ
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Google Sign-in Corporate Authentication Modal (Clean & Minimal) */}
          {showLoginModal && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 sm:p-7 overflow-hidden text-center">
                
                {/* Close Button */}
                <button
                  type="button"
                  onClick={() => { setShowLoginModal(false); setLoginError(""); }}
                  className="absolute top-4 right-4 p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                >
                  <Icon name="x" className="w-4 h-4" />
                </button>

                {/* Google Icon Badge */}
                <div className="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center mx-auto mb-3 shadow-inner">
                  <svg className="w-6 h-6" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                  </svg>
                </div>

                <h3 className="text-base font-extrabold text-slate-900 dark:text-white mb-5">
                  Sign in with Google
                </h3>

                {/* Official Google Identity Services Button Container */}
                <div className="flex flex-col items-center justify-center min-h-[46px]">
                  <div id="googleSignInBtnContainer" className="flex justify-center"></div>
                  {isGsiLoading && (
                    <span className="text-xs text-slate-400 mt-2">กำลังเชื่อมต่อ Google...</span>
                  )}
                </div>

                {/* Error alert box */}
                {loginError && (
                  <div className="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-900 text-rose-700 dark:text-rose-300 text-xs font-semibold leading-relaxed mt-4 text-center">
                    {loginError}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-2xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-2xl text-xs font-semibold flex items-center gap-2 animate-bounce">
              <Icon name="checkCircle" className="w-4 h-4 text-emerald-400" />
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
